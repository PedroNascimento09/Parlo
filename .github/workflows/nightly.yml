name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    name: Reset the nightly release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the workspace version
        id: version
        run: echo "value=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Delete the previous nightly release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --yes --cleanup-tag || true

      - name: Create an empty nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly \
            --title nightly \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --notes "Built from main at commit ${{ github.sha }} for version ${{ steps.version.outputs.value }}. This is a nightly build, not a stable release."

  build:
    name: Build ${{ matrix.target }}
    needs: reset
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: parlo-linux-x86_64-nightly.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: parlo-macos-aarch64-nightly.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: parlo-windows-x86_64-nightly.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p parlo-cli

      - name: Package unix
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release parlo

      - name: Package windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/parlo.exe -DestinationPath ${{ matrix.archive }}

      - name: Attach to the nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nightly
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: ${{ matrix.archive }}
          body: Built from main at commit ${{ github.sha }} for version ${{ needs.reset.outputs.version }}. This is a nightly build, not a stable release.
