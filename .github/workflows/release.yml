name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: parlo-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: parlo-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: parlo-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p parlo-cli

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engines/cascade/requirements.txt

      - name: Install engine requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r engines/cascade/requirements.txt

      - name: Build the engine
        working-directory: engines/cascade
        run: pyinstaller --noconfirm --clean parlo-engine.spec

      - name: Package unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/parlo release/
          cp -r engines/cascade/dist/parlo-engine release/
          cp assets/parlo.ico assets/parlo.png release/
          cp README.md release/
          tar -czf ${{ matrix.archive }} -C release parlo parlo-engine parlo.png parlo.ico README.md

      - name: Package windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target/${{ matrix.target }}/release/parlo.exe release/
          Copy-Item engines/cascade/dist/parlo-engine release/parlo-engine -Recurse
          Copy-Item assets/parlo.ico, assets/parlo.png release/
          Copy-Item README.md release/
          Compress-Archive -Path release/parlo.exe, release/parlo-engine, release/parlo.ico, release/parlo.png, release/README.md -DestinationPath ${{ matrix.archive }} -Force

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
