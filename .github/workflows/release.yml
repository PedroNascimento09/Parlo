name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach
        required: true

permissions:
  contents: write

jobs:
  licences:
    name: Licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engines/cascade/requirements.txt
            engines/tts-piper/requirements.txt

      - name: Install the dependency closures
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r engines/cascade/requirements.txt
          python -m pip install -r engines/tts-piper/requirements.txt

      - name: Check licences, models and pinned versions
        run: python tools/licenses.py check --verify-installed --strict --strict-models

      - name: Regenerate the notices, the index and the SBOM
        run: |
          python tools/licenses.py notices --out THIRD_PARTY_NOTICES.md
          python tools/licenses.py index --out LICENSES.md
          python tools/licenses.py sbom --out sbom.cdx.json
          git diff --exit-code THIRD_PARTY_NOTICES.md LICENSES.md

      - uses: actions/upload-artifact@v4
        with:
          name: licence-documents
          path: |
            LICENSES.md
            THIRD_PARTY_NOTICES.md
            sbom.cdx.json

  build:
    name: Build ${{ matrix.target }}
    needs: licences
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: parlo-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: parlo-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: parlo-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p parlo-cli -p parlo-app

      - name: Build the Rust engine
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --manifest-path crates/parlo-engine-rs/Cargo.toml --release --target x86_64-pc-windows-msvc

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engines/cascade/requirements.txt

      - name: Install the cpu build of torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install engine requirements
        run: python -m pip install pyinstaller -r engines/cascade/requirements.txt

      - name: Build the engine
        working-directory: engines/cascade
        run: |
          pyinstaller --noconfirm --clean parlo-engine.spec
          du -sh dist/parlo-engine

      - uses: actions/download-artifact@v4
        with:
          name: licence-documents

      - name: Package unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/parlo release/
          cp target/${{ matrix.target }}/release/parlo-app release/
          cp -r engines/cascade/dist/parlo-engine release/
          cp assets/parlo.ico assets/parlo.png release/
          cp README.md LICENSE NOTICE LICENSES.md THIRD_PARTY_NOTICES.md sbom.cdx.json release/
          tar -czf ${{ matrix.archive }} -C release \
            parlo parlo-app parlo-engine parlo.png parlo.ico \
            README.md LICENSE NOTICE LICENSES.md THIRD_PARTY_NOTICES.md sbom.cdx.json

      - name: Package windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target/${{ matrix.target }}/release/parlo.exe release/
          Copy-Item target/${{ matrix.target }}/release/parlo-app.exe release/
          $loader = Get-ChildItem -Path target -Recurse -Filter WebView2Loader.dll -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1
          if (-not $loader) { throw "WebView2Loader.dll was not produced by the build" }
          Copy-Item $loader.FullName release/
          Copy-Item engines/cascade/dist/parlo-engine release/parlo-engine -Recurse
          $rust = "crates/parlo-engine-rs/target/x86_64-pc-windows-msvc/release"
          New-Item -ItemType Directory -Force release/parlo-engine-rs | Out-Null
          Copy-Item "$rust/parlo-engine.exe", "$rust/sherpa-onnx-c-api.dll", "$rust/sherpa-onnx-cxx-api.dll", "$rust/onnxruntime.dll", "$rust/onnxruntime_providers_shared.dll" release/parlo-engine-rs
          Copy-Item assets/parlo.ico, assets/parlo.png release/
          Copy-Item README.md, LICENSE, NOTICE, LICENSES.md, THIRD_PARTY_NOTICES.md, sbom.cdx.json release/
          Compress-Archive -Path release/parlo.exe, release/parlo-app.exe, release/WebView2Loader.dll, release/parlo-engine, release/parlo-engine-rs, release/parlo.ico, release/parlo.png, release/README.md, release/LICENSE, release/NOTICE, release/LICENSES.md, release/THIRD_PARTY_NOTICES.md, release/sbom.cdx.json -DestinationPath ${{ matrix.archive }} -Force

      - name: Sign the Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX)) {
            "SIGNED=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "No signing certificate is configured, so the binaries ship unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "parlo-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1
          if (-not $signtool) { throw "signtool is missing, so the binaries cannot be signed" }
          foreach ($file in @("release/parlo.exe", "release/parlo-app.exe")) {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $file" }
          }
          "SIGNED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNING_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the one click installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $payload = "build/installer/payload"
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item release/parlo.exe $payload/
          Copy-Item release/parlo-app.exe $payload/
          Copy-Item release/WebView2Loader.dll $payload/
          Copy-Item release/parlo.png $payload/
          Copy-Item release/parlo-engine "$payload/parlo-engine" -Recurse
          $version = ("${{ github.event.inputs.tag || github.ref_name }}").TrimStart("v")
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup is missing, so the one click installer cannot be built" }
          if ($env:SIGNED -eq "1") {
            $sign = "signtool sign /fd SHA256 /f `"$env:SIGNING_PFX_PATH`" /p `"$env:SIGNING_PASSWORD`" /tr http://timestamp.digicert.com /td SHA256 `$f"
            & $iscc "/DAppVersion=$version" "/DSignedInstall" "/Sparlo=$sign" "installer/parlo.iss"
          } else {
            & $iscc "/DAppVersion=$version" "installer/parlo.iss"
          }
          if ($LASTEXITCODE -ne 0) { throw "The installer did not compile" }
          Get-Item "build/installer/Parlo-Setup.exe" | Select-Object Name, Length

      - name: Attest the archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.archive }}

      - name: Attest the installer
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/installer/Parlo-Setup.exe

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ matrix.archive }}
            sbom.cdx.json
            build/installer/Parlo-Setup.exe
          generate_release_notes: false

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          gh release download "${{ github.event.inputs.tag || github.ref_name }}" --dir assets

      - name: Write SHA256SUMS.txt
        working-directory: assets
        run: |
          sha256sum * | grep -v ' SHA256SUMS.txt$' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach the checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: assets/SHA256SUMS.txt
