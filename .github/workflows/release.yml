name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach
        required: true

permissions:
  contents: write

jobs:
  licences:
    name: Licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engines/cascade/requirements.txt
            engines/tts-piper/requirements.txt

      - name: Install the dependency closures
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r engines/cascade/requirements.txt
          python -m pip install -r engines/tts-piper/requirements.txt

      - name: Check licences, models and pinned versions
        run: python tools/licenses.py check --verify-installed --strict --strict-models

      - name: Regenerate the notices, the index and the SBOM
        run: |
          python tools/licenses.py notices --out THIRD_PARTY_NOTICES.md
          python tools/licenses.py index --out LICENSES.md
          python tools/licenses.py sbom --out sbom.cdx.json
          git diff --exit-code THIRD_PARTY_NOTICES.md LICENSES.md

      - uses: actions/upload-artifact@v4
        with:
          name: licence-documents
          path: |
            LICENSES.md
            THIRD_PARTY_NOTICES.md
            sbom.cdx.json

  build:
    name: Build ${{ matrix.target }}
    needs: licences
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: parlo-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: parlo-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: parlo-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p parlo-cli -p parlo-app

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engines/cascade/requirements.txt

      - name: Install the cpu build of torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install engine requirements
        run: python -m pip install pyinstaller -r engines/cascade/requirements.txt

      - name: Build the engine
        working-directory: engines/cascade
        run: |
          pyinstaller --noconfirm --clean parlo-engine.spec
          du -sh dist/parlo-engine

      - uses: actions/download-artifact@v4
        with:
          name: licence-documents

      - name: Package unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/parlo release/
          cp target/${{ matrix.target }}/release/parlo-app release/
          cp -r engines/cascade/dist/parlo-engine release/
          cp assets/parlo.ico assets/parlo.png release/
          cp README.md LICENSE NOTICE LICENSES.md THIRD_PARTY_NOTICES.md sbom.cdx.json release/
          tar -czf ${{ matrix.archive }} -C release \
            parlo parlo-app parlo-engine parlo.png parlo.ico \
            README.md LICENSE NOTICE LICENSES.md THIRD_PARTY_NOTICES.md sbom.cdx.json

      - name: Package windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target/${{ matrix.target }}/release/parlo.exe release/
          Copy-Item target/${{ matrix.target }}/release/parlo-app.exe release/
          Copy-Item engines/cascade/dist/parlo-engine release/parlo-engine -Recurse
          Copy-Item assets/parlo.ico, assets/parlo.png release/
          Copy-Item README.md, LICENSE, NOTICE, LICENSES.md, THIRD_PARTY_NOTICES.md, sbom.cdx.json release/
          Compress-Archive -Path release/parlo.exe, release/parlo-app.exe, release/parlo-engine, release/parlo.ico, release/parlo.png, release/README.md, release/LICENSE, release/NOTICE, release/LICENSES.md, release/THIRD_PARTY_NOTICES.md, release/sbom.cdx.json -DestinationPath ${{ matrix.archive }} -Force

      - name: Build the one click installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sevenZip = @(
            "$env:ProgramFiles\7-Zip\7z.exe",
            "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sevenZip) {
            choco install 7zip.install -y --no-progress
            $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          }
          if (-not (Test-Path $sevenZip)) { throw "7-Zip is missing, so the one click installer cannot be built" }
          $sfxModule = @("$(Split-Path $sevenZip)\7z.sfx", "$(Split-Path $sevenZip)\7zCon.sfx") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sfxModule) { throw "The 7-Zip self extracting module is missing" }
          New-Item -ItemType Directory -Force sfx | Out-Null
          Copy-Item scripts/install.ps1 sfx/install.ps1
          Copy-Item scripts/setup.ps1 sfx/setup.ps1
          & $sevenZip a -t7z -mx=1 sfx/payload.7z ${{ matrix.archive }} sfx/install.ps1 sfx/setup.ps1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not build the payload" }
          $config = @(
            ';!@Install@!UTF-8!'
            'Title="Parlo"'
            'BeginPrompt=""'
            'RunProgram="powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1"'
            'GUIMode="1"'
            ';!@InstallEnd@!'
          )
          Set-Content -Path sfx/config.txt -Value $config -Encoding utf8
          cmd /c copy /b "$sfxModule" + sfx\config.txt + sfx\payload.7z Parlo-Setup.exe
          if (-not (Test-Path Parlo-Setup.exe)) { throw "The one click installer was not produced" }
          Get-Item Parlo-Setup.exe | Select-Object Name, Length

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ matrix.archive }}
            sbom.cdx.json
            Parlo-Setup.exe
          generate_release_notes: false
