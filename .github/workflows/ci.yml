name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Check the page script parses
        run: node --check crates/parlo-cli/web/app.js

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Smoke test the CLI
        run: |
          cargo run --release -p parlo-cli -- doctor
          cargo run --release -p parlo-cli -- demo

  cascade:
    name: Cascade helpers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/cascade
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numeric runtime
        run: pip install numpy onnxruntime

      - name: Test
        run: python -m unittest discover -s tests -v

  python:
    name: Sidecar (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: engines/hibiki
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Test
        run: python -m unittest discover -s tests -v

  licences:
    name: Licences and notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engines/cascade/requirements.txt
            engines/tts-piper/requirements.txt

      - name: Install the dependency closures
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r engines/cascade/requirements.txt
          python -m pip install -r engines/tts-piper/requirements.txt

      - name: Check every component against the policy
        run: python tools/licenses.py check --verify-installed

      - name: Check the notices and the licence index are current
        run: |
          python tools/licenses.py notices --out THIRD_PARTY_NOTICES.md
          python tools/licenses.py index --out LICENSES.md
          git diff --exit-code THIRD_PARTY_NOTICES.md LICENSES.md

  orchestration:
    name: Model orchestration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install tooling
        run: python -m pip install -r tools/requirements.txt

      - name: Test the orchestration tooling
        run: python -m unittest discover -s tools/tests -v

      - name: Validate the shipped manifests
        run: python tools/pimo/__main__.py validate catalog/manifests

  signoff:
    name: Sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit carries a Developer Certificate of Origin sign-off
        run: |
          base="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          missing=""
          for sha in $(git rev-list "$base..HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+>$'; then
              missing="$missing $sha"
            fi
          done
          if [ -n "$missing" ]; then
            echo "These commits are missing a Signed-off-by line:$missing"
            echo "Amend them with: git commit --amend -s"
            exit 1
          fi
