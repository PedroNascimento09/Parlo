name: parlo
base: core24
version: '0.2.5'
summary: Offline dictation, translation and meetings
description: |
  Parlo turns speech into writing on this computer and never sends audio
  anywhere. The same engine serves live text, captions, meetings and dubbing.
grade: stable
confinement: strict
architectures:
  - build-on: amd64
    build-for: amd64

apps:
  parlo:
    command: bin/parlo
    plugs:
      - audio-playback
      - audio-record
  parlo-app:
    command: bin/parlo-app
    extensions:
      - gnome
    plugs:
      - audio-playback
      - audio-record

parts:
  parlo:
    plugin: dump
    source: https://github.com/PedroNascimento09/Parlo/releases/download/v0.2.5/parlo-linux-x86_64.tar.gz
    source-checksum: sha256/8b11f7b2c637d04891f578c10eefee40ad7b645c0d480cdf531367c2f16b6530
    stage-packages:
      - libasound2t64
    organize:
      parlo: bin/parlo
      parlo-app: bin/parlo-app
      parlo-engine: lib/parlo/parlo-engine
      parlo.png: share/icons/hicolor/512x512/apps/parlo.png
