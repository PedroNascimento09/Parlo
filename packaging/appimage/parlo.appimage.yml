version: 0.2.12
script:
  - curl -fsSL -o parlo-linux-x86_64.tar.gz https://github.com/PedroNascimento09/Parlo/releases/download/v0.2.12/parlo-linux-x86_64.tar.gz
  - echo "bcb6d35b555a08b56912d5651c8c245aebe5517e33a57b7413c9bc5a656ea574  parlo-linux-x86_64.tar.gz" | sha256sum -c -
  - tar -xzf parlo-linux-x86_64.tar.gz
AppDir:
  path: ./AppDir
  app_info:
    id: io.github.pedronascimento09.parlo
    name: parlo
    icon: parlo
    version: 0.2.12
    exec: parlo
    exec_args: $@
  files:
    include:
      - parlo
      - parlo-app
      - parlo-engine/**
      - parlo.png
      - LICENSE
AppImage:
  arch: x86_64
  file_name: parlo-0.2.12-x86_64.AppImage
