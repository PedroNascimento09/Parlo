[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parlo-hibiki"
version = "0.1.0"
description = "Hibiki-Zero speech to speech adapter for Parlo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.4", "numpy>=1.26"]

[tool.setuptools]
packages = ["parlo_hibiki"]
