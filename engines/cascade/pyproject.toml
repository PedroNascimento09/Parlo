[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parlo-cascade"
version = "0.1.0"
description = "Universal CPU cascade engine for Parlo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "faster-whisper==1.2.1",
    "sherpa-onnx==2.0.1",
    "ctranslate2==4.8.4",
    "sentencepiece==0.2.2",
    "numpy==2.5.4",
    "truststore==0.10.5",
    "psutil==7.2.2",
]

[tool.setuptools]
packages = ["parlo_cascade"]
