[workspace]
resolver = "2"
members = ["crates/parlo-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
authors = ["Parlo contributors"]
repository = "https://github.com/Pedromrn0903/parlo"
homepage = "https://github.com/Pedromrn0903/parlo"

[workspace.dependencies]
parlo-core = { path = "crates/parlo-core" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
