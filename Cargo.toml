[workspace]
resolver = "2"
members = ["crates/parlo-core", "crates/parlo-cli", "crates/parlo-app"]
exclude = ["crates/parlo-engine-rs"]

[workspace.package]
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Parlo contributors"]
repository = "https://github.com/PedroNascimento09/parlo"
homepage = "https://github.com/PedroNascimento09/parlo"

[workspace.dependencies]
parlo-core = { path = "crates/parlo-core" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
