<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parlo</title>
    <style>
      :root {
        --paper: #f6f2ea;
        --ink: #191512;
        --muted: #6f6559;
        --accent: #2f6b4f;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #13110e;
          --ink: #f4efe4;
          --muted: #9c9284;
          --accent: #9ed9b4;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        text-align: center;
        max-width: 26rem;
        padding: 2rem;
        animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .wave {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        height: 28px;
        margin: 0 auto 1.2rem;
      }
      .wave span {
        width: 4px;
        height: 100%;
        border-radius: 2px;
        background: var(--accent);
        transform-origin: center;
        animation: wave 1.4s ease-in-out infinite;
      }
      .wave span:nth-child(1) { animation-delay: 0s; }
      .wave span:nth-child(2) { animation-delay: 0.12s; }
      .wave span:nth-child(3) { animation-delay: 0.24s; }
      .wave span:nth-child(4) { animation-delay: 0.36s; }
      .wave span:nth-child(5) { animation-delay: 0.48s; }
      .wave span:nth-child(6) { animation-delay: 0.6s; }
      .wave span:nth-child(7) { animation-delay: 0.72s; }
      h1 {
        font-family: "Sitka Banner", "Sitka Heading", "Iowan Old Style", Georgia, serif;
        font-size: 1.9rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        margin: 0 0 0.5rem;
      }
      p { margin: 0; color: var(--muted); font-size: 0.92rem; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes wave {
        0%, 100% { transform: scaleY(0.25); opacity: 0.5; }
        50% { transform: scaleY(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        main, .wave span { animation: none; }
        .wave span { transform: none; opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <main aria-busy="true">
      <div class="wave" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <h1>Parlo</h1>
      <p>Getting ready.</p>
    </main>
  </body>
</html>
