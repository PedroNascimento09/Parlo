<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parlo</title>
    <style>
      :root {
        --paper: #f6f2ea;
        --ink: #191512;
        --muted: #6f6559;
        --accent: #2f6b4f;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #13110e;
          --ink: #f4efe4;
          --muted: #9c9284;
          --accent: #9ed9b4;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { text-align: center; max-width: 26rem; padding: 2rem; }
      .mark {
        width: 54px;
        height: 54px;
        margin: 0 auto 1.6rem;
        border-radius: 17px;
        background: var(--accent);
        animation: breathe 1.9s ease-in-out infinite;
      }
      h1 {
        font-family: "Sitka Banner", "Sitka Heading", "Iowan Old Style", Georgia, serif;
        font-size: 1.9rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        margin: 0 0 0.6rem;
      }
      p { margin: 0; color: var(--muted); font-size: 0.92rem; }
      @keyframes breathe {
        0%, 100% { opacity: 0.35; transform: scale(0.94); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark { animation: none; opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"></div>
      <h1>Starting Parlo</h1>
      <p id="hint">Loading the engine. This can take a minute the first time.</p>
    </main>
  </body>
</html>
