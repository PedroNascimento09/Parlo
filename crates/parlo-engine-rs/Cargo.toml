[package]
name = "parlo-engine-rs"
version = "0.2.1+2"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "parlo-engine"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ct2rs = { version = "0.10.3", default-features = false, features = ["ruy"] }
sentencepiece = "0.13"
serde_json = "1"
sherpa-onnx = { version = "2.0.1", default-features = false, features = ["shared"] }
