<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="parlo-version" content="__PARLO_VERSION__">
<meta name="color-scheme" content="light dark">
<title data-i18n="captions.title">Parlo Captions</title>
<style>
  :root {
    --shell: rgba(255, 253, 248, 0.94);
    --ink: #191512;
    --muted: #6f6559;
    --accent: #2f6b4f;
    --line: rgba(25, 21, 18, 0.14);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --shell: rgba(19, 17, 14, 0.92);
      --ink: #f4efe4;
      --muted: #9c9284;
      --accent: #9ed9b4;
      --line: rgba(244, 239, 228, 0.16);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 6px;
    padding: 14px 18px;
    font: 15px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--shell);
    border-radius: 18px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }
  body.listening .dot {
    background: var(--accent);
    animation: pulse 1.4s ease-out infinite;
  }
  .lines {
    overflow-y: auto;
    display: grid;
    align-content: end;
    gap: 0.35rem;
  }
  .line {
    font-family: "Sitka Text", "Sitka Heading", "Iowan Old Style", Georgia, serif;
    font-size: 1.35rem;
    line-height: 1.35;
  }
  .line.said {
    color: var(--muted);
    font-size: 0.95rem;
  }
  footer {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }
  button {
    border: 1px solid var(--line);
    background: none;
    color: inherit;
    font: inherit;
    font-size: 12px;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0.75;
  }
  button:hover,
  button:focus-visible { opacity: 1; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(47, 107, 79, 0.45); }
    70% { box-shadow: 0 0 0 10px rgba(47, 107, 79, 0); }
    100% { box-shadow: 0 0 0 0 rgba(47, 107, 79, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    body.listening .dot { animation: none; }
  }
</style>
</head>
<body>
  <header>
    <span class="dot" aria-hidden="true"></span>
    <span id="state" data-i18n="captions.paused">Captions paused</span>
  </header>
  <div class="lines" id="lines" aria-live="polite"></div>
  <footer>
    <button id="source" type="button" data-i18n="captions.soundMicrophone">Sound: Microphone</button>
    <button id="size" type="button" data-i18n="captions.smaller">Smaller</button>
    <button id="save" type="button" data-i18n="captions.save">Save</button>
    <button id="toggle" type="button" data-i18n="captions.start">Start</button>
  </footer>
<script>
const token = new URLSearchParams(location.search).get("t") || "";
let strings = {};

function t(key, fallback, values = {}) {
  const text = strings[key] || fallback;
  return Object.entries(values).reduce(
    (out, [name, value]) => out.split("{" + name + "}").join(String(value)),
    text,
  );
}

function applyText() {
  document.title = t("captions.title", "Parlo Captions");
  for (const element of document.querySelectorAll("[data-i18n]")) {
    element.textContent = t(element.dataset.i18n, element.textContent);
  }
}

async function loadLocale() {
  try {
    const response = await fetch("/locale", { cache: "no-store" });
    if (response.ok) {
      const table = await response.json();
      strings = table.strings || {};
      document.documentElement.lang = table.locale || "en";
      document.documentElement.dir = table.locale === "ar" ? "rtl" : "ltr";
    }
  } catch {
    strings = {};
  }
  applyText();
  toggleButton.textContent = running ? t("captions.stop", "Stop") : t("captions.start", "Start");
  if (running) {
    setState(listeningText(), true);
  }
}

function listeningText() {
  const source = system
    ? t("captions.computerSource", "Captions from the computer's sound")
    : t("captions.microphoneSource", "Captions from the microphone");
  return t("captions.listening", "{source} · listening, every 2.5 seconds · Escape stops", { source });
}

const TARGET_RATE = 16000;
const WINDOW_SECONDS = 2.5;
const MAX_LINES = 6;

const stateEl = document.getElementById("state");
const linesEl = document.getElementById("lines");
const sourceButton = document.getElementById("source");
const sizeButton = document.getElementById("size");
const toggleButton = document.getElementById("toggle");
const saveButton = document.getElementById("save");
const session = [];
let startedAt = 0;

let stream = null;
let context = null;
let source = null;
let processor = null;
let sink = null;
let chunks = [];
let sending = false;
let running = false;
let system = false;
let scale = 1;

function setState(text, listening) {
  stateEl.textContent = text;
  document.body.classList.toggle("listening", Boolean(listening));
}

function downsample(samples, from, to) {
  if (from === to) {
    return samples;
  }
  const ratio = from / to;
  const length = Math.max(Math.floor(samples.length / ratio), 1);
  const out = new Float32Array(length);
  for (let index = 0; index < length; index += 1) {
    const start = Math.floor(index * ratio);
    const end = Math.min(Math.floor((index + 1) * ratio), samples.length);
    let sum = 0;
    let count = 0;
    for (let cursor = start; cursor < end; cursor += 1) {
      sum += samples[cursor];
      count += 1;
    }
    out[index] = count ? sum / count : 0;
  }
  return out;
}

function encodeWav(samples, rate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const text = (offset, value) => {
    for (let index = 0; index < value.length; index += 1) {
      view.setUint8(offset + index, value.charCodeAt(index));
    }
  };
  text(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  text(8, "WAVE");
  text(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, rate, true);
  view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  text(36, "data");
  view.setUint32(40, samples.length * 2, true);
  for (let index = 0; index < samples.length; index += 1) {
    const value = Math.max(-1, Math.min(1, samples[index]));
    view.setInt16(44 + index * 2, value * 32767, true);
  }
  return new Blob([buffer], { type: "audio/wav" });
}

function addLine(text, said) {
  const line = document.createElement("p");
  line.className = said ? "line said" : "line";
  line.style.fontSize = said ? "" : 1.35 * scale + "rem";
  line.textContent = text;
  linesEl.append(line);
  while (linesEl.children.length > MAX_LINES) {
    linesEl.firstElementChild.remove();
  }
  linesEl.scrollTop = linesEl.scrollHeight;
}

async function send(buffer, rate) {
  if (sending || !buffer.length) {
    return;
  }
  sending = true;
  try {
    const wav = encodeWav(downsample(buffer, rate, TARGET_RATE), TARGET_RATE);
    const response = await fetch("/dictate", {
      method: "POST",
      headers: { "Content-Type": "audio/wav", Authorization: "Bearer " + token },
      body: wav,
    });
    if (!response.ok) {
      return;
    }
    const result = await response.json();
    const said = (result.text || "").trim();
    const shown = (result.translation || "").trim() || said;
    if (shown) {
      addLine(shown, false);
      session.push({ at_ms: Math.max(0, Date.now() - startedAt), text: shown });
    }
    if (said && said !== shown) {
      addLine(said, true);
    }
  } catch (failure) {
    setState(t("captions.engineSilent", "The engine did not answer"), running);
  }
  sending = false;
}

async function start() {
  try {
    if (system) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        throw new Error(t("captions.cannotCapture", "This browser cannot capture the computer's sound."));
      }
      const display = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      display.getVideoTracks().forEach((track) => track.stop());
      const audio = display.getAudioTracks();
      if (!audio.length) {
        display.getTracks().forEach((track) => track.stop());
        throw new Error(t("captions.noSound", "No sound was shared. Choose a tab or window and tick Share audio."));
      }
      stream = new MediaStream(audio);
    } else {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
      });
    }
  } catch (failure) {
    setState(
      system
        ? (failure && failure.message) || t("captions.noSound", "No sound was shared. Choose a tab or window and tick Share audio.")
        : t("captions.micBlocked", "The microphone is blocked"),
      false
    );
    return;
  }
  context = new (window.AudioContext || window.webkitAudioContext)();
  source = context.createMediaStreamSource(stream);
  processor = context.createScriptProcessor(4096, 1, 1);
  sink = context.createGain();
  sink.gain.value = 0;
  chunks = [];
  processor.onaudioprocess = (event) => {
    const block = event.inputBuffer.getChannelData(0);
    const copy = new Float32Array(block.length);
    copy.set(block);
    chunks.push(copy);
    const length = chunks.reduce((total, chunk) => total + chunk.length, 0);
    if (length < context.sampleRate * WINDOW_SECONDS) {
      return;
    }
    const merged = new Float32Array(length);
    let offset = 0;
    for (const chunk of chunks) {
      merged.set(chunk, offset);
      offset += chunk.length;
    }
    chunks = [];
    send(merged, context.sampleRate);
  };
  source.connect(processor);
  processor.connect(sink);
  sink.connect(context.destination);
  running = true;
  startedAt = Date.now();
  toggleButton.textContent = t("captions.stop", "Stop");
  setState(listeningText(), true);
}

function stop() {
  running = false;
  toggleButton.textContent = t("captions.start", "Start");
  setState(t("captions.paused", "Captions paused"), false);
  if (processor) {
    processor.onaudioprocess = null;
    processor.disconnect();
  }
  if (source) {
    source.disconnect();
  }
  if (sink) {
    sink.disconnect();
  }
  if (stream) {
    stream.getTracks().forEach((track) => track.stop());
  }
  if (context && context.state !== "closed") {
    context.close();
  }
  stream = null;
  context = null;
  source = null;
  processor = null;
  sink = null;
  chunks = [];
}

toggleButton.addEventListener("click", () => {
  if (running) {
    stop();
  } else {
    start();
  }
});

sourceButton.addEventListener("click", () => {
  if (running) {
    stop();
  }
  system = !system;
  sourceButton.textContent = system
    ? t("captions.soundComputer", "Sound: Computer")
    : t("captions.soundMicrophone", "Sound: Microphone");
  setState(
    system
      ? t("captions.computerSelected", "Computer sound selected. Press Start, choose a tab or window, and tick Share audio.")
      : t("captions.microphoneSelected", "Microphone selected. Press Start."),
    false
  );
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && running) {
    event.preventDefault();
    stop();
  }
});

saveButton.addEventListener("click", async () => {
  if (!session.length) {
    setState(t("captions.nothingToSave", "Nothing to save yet"), running);
    return;
  }
  saveButton.disabled = true;
  try {
    const response = await fetch("/captions/save", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ lines: session }),
    });
    const detail = await response.json().catch(() => ({}));
    setState(detail.message || detail.error || t("captions.notSaved", "The captions were not saved"), running);
  } catch (failure) {
    setState(t("captions.notSaved", "The captions were not saved"), running);
  } finally {
    saveButton.disabled = false;
  }
});

sizeButton.addEventListener("click", () => {
  scale = scale >= 1.4 ? 0.85 : scale + 0.25;
  for (const line of linesEl.querySelectorAll(".line:not(.said)")) {
    line.style.fontSize = 1.35 * scale + "rem";
  }
});

loadLocale();
start();

try {
  const channel = new BroadcastChannel("parlo-locale");
  channel.onmessage = () => {
    loadLocale();
  };
} catch {}
</script>
</body>
</html>
