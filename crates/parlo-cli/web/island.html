<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="parlo-version" content="__PARLO_VERSION__">
<meta name="color-scheme" content="light dark">
<title>Parlo Dictate</title>
<style>
  :root {
    --shell: rgba(13, 18, 14, 0.94);
    --ink: #f0f3ea;
    --muted: #8d968a;
    --line: rgba(240, 243, 234, 0.14);
    --accent: #c9f26b;
    --accent-ink: #0a0e0b;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --shell: rgba(255, 255, 255, 0.96);
      --ink: #0e120f;
      --muted: #5e665c;
      --line: rgba(14, 18, 15, 0.14);
      --accent: #3d5a12;
      --accent-ink: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; }
  body {
    display: grid;
    align-items: center;
    justify-items: center;
    padding: 8px;
    font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .island {
    display: flex;
    align-items: center;
    gap: 10px;
    width: max-content;
    max-width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--shell);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(18px) saturate(140%);
    animation: settle 140ms cubic-bezier(0.2, 0.9, 0.3, 1) both;
  }
  body.ready .island { border-radius: 16px; padding: 14px 16px 14px 18px; gap: 14px; }
  body.ready .switch { width: 46px; height: 26px; }
  body.ready .switch .knob { width: 20px; height: 20px; }
  body.ready .switch[aria-checked="true"] .knob { transform: translateX(20px); }
  body.ready .record { font-size: 13.5px; padding: 8px 18px; }
  .wave {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 18px;
    width: 24px;
    transition: width 140ms ease;
  }
  .wave i {
    display: block;
    width: 2.5px;
    height: 3px;
    border-radius: 2px;
    background: var(--muted);
    transition: height 80ms linear, background 160ms ease;
  }
  body.listening .wave { width: 46px; gap: 3px; }
  body.listening .wave i { background: var(--accent); }
  .readout {
    display: grid;
    gap: 1px;
    min-width: 0;
    max-width: 320px;
  }
  body.ready .readout,
  body.listening .readout,
  body.listening .actions { display: none; }
  .state {
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .line {
    font-size: 13px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .line.pending { color: var(--muted); }
  .actions {
    display: none;
    align-items: center;
    gap: 10px;
  }
  body.ready .actions { display: flex; }
  .switch-copy {
    display: grid;
    gap: 1px;
    line-height: 1.25;
  }
  .switch-title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
  }
  .switch-sub {
    font-size: 10.5px;
    color: var(--muted);
  }
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: color-mix(in srgb, var(--muted) 30%, transparent);
    cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease;
  }
  .switch[aria-checked="true"] {
    background: var(--accent);
    border-color: var(--accent);
  }
  .switch .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--ink);
    transition: transform 160ms cubic-bezier(0.2, 0.9, 0.3, 1), background 160ms ease;
  }
  .switch[aria-checked="true"] .knob {
    transform: translateX(18px);
    background: var(--accent-ink);
  }
  .switch:focus-visible,
  .record:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .record {
    font: inherit;
    font-size: 12.5px;
    padding: 6px 14px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  @keyframes settle {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .island, .switch, .switch .knob, .wave, .wave i { animation: none; transition: none; }
  }
</style>
</head>
<body>
  <div class="island">
    <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <div class="readout">
      <span class="state" id="state">Ready</span>
      <span class="line pending" id="line">Hold the shortcut to talk.</span>
    </div>
    <div class="actions">
      <span class="switch-copy">
        <span class="switch-title" id="switch-label">Clean text</span>
        <span class="switch-sub">removes the words you took back</span>
      </span>
      <button type="button" class="switch" id="tidy" role="switch" aria-checked="true" aria-labelledby="switch-label">
        <span class="knob"></span>
      </button>
      <button type="button" class="record" id="record">Record</button>
    </div>
  </div>
<script>
const token = new URLSearchParams(location.search).get("t") || "";
const TARGET_RATE = 16000;
const MAX_SECONDS = 60;
const WEIGHTS = [0.55, 0.9, 1, 0.75, 0.95, 0.6, 0.8];

const stateEl = document.getElementById("state");
const lineEl = document.getElementById("line");
const tidyEl = document.getElementById("tidy");
const recordEl = document.getElementById("record");
const bars = [...document.querySelectorAll(".wave i")];
const version = document.querySelector('meta[name="parlo-version"]').content;

let stream = null;
let context = null;
let source = null;
let processor = null;
let sink = null;
let chunks = [];
let started = 0;
let ticker = null;
let busy = false;
let lastText = "";
let target = false;
let writeTarget = "";
let controller = null;
let sentChunks = 0;
let partials = null;
let tidy = localStorage.getItem("parlo-tidy") !== "off";

function setState(text, line, pending) {
  stateEl.textContent = text;
  if (line !== undefined) {
    lineEl.textContent = line;
    lineEl.classList.toggle("pending", Boolean(pending));
  }
}

function report(state) {
  fetch("/state", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: JSON.stringify({ state }),
    keepalive: true,
  }).catch(() => {});
}

function describeMicrophone(failure) {
  const name = failure && failure.name;
  if (name === "NotAllowedError") {
    return "The microphone is blocked. Allow it in the Parlo window and try again.";
  }
  if (name === "NotFoundError") {
    return "No microphone was found. Plug one in and try again.";
  }
  return "The microphone did not open. Check that another program is not using it.";
}

function downsample(samples, from, to) {
  if (from === to) {
    return samples;
  }
  const ratio = from / to;
  const length = Math.max(Math.floor(samples.length / ratio), 1);
  const out = new Float32Array(length);
  for (let index = 0; index < length; index += 1) {
    const start = Math.floor(index * ratio);
    const end = Math.min(Math.floor((index + 1) * ratio), samples.length);
    let sum = 0;
    let count = 0;
    for (let cursor = start; cursor < end; cursor += 1) {
      sum += samples[cursor];
      count += 1;
    }
    out[index] = count ? sum / count : 0;
  }
  return out;
}

function encodeWav(samples, rate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const text = (offset, value) => {
    for (let index = 0; index < value.length; index += 1) {
      view.setUint8(offset + index, value.charCodeAt(index));
    }
  };
  text(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  text(8, "WAVE");
  text(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, rate, true);
  view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  text(36, "data");
  view.setUint32(40, samples.length * 2, true);
  for (let index = 0; index < samples.length; index += 1) {
    const value = Math.max(-1, Math.min(1, samples[index]));
    view.setInt16(44 + index * 2, value * 32767, true);
  }
  return new Blob([buffer], { type: "audio/wav" });
}

function paintLevel(block) {
  let peak = 0;
  for (let index = 0; index < block.length; index += 1) {
    const value = Math.abs(block[index]);
    if (value > peak) {
      peak = value;
    }
  }
  bars.forEach((bar, index) => {
    const height = Math.min(18, 3 + peak * 90 * WEIGHTS[index]);
    bar.style.height = height.toFixed(1) + "px";
  });
}

async function begin() {
  if (busy || document.hidden || stream) {
    return;
  }
  const app = await beginTarget();
  target = Boolean(app);
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (failure) {
    document.body.classList.remove("ready");
    setState("Microphone blocked", describeMicrophone(failure), true);
    report("error");
    return;
  }
  context = new (window.AudioContext || window.webkitAudioContext)();
  source = context.createMediaStreamSource(stream);
  processor = context.createScriptProcessor(2048, 1, 1);
  sink = context.createGain();
  sink.gain.value = 0;
  chunks = [];
  sentChunks = 0;
  clearInterval(partials);
  partials = setInterval(sendPartial, 800);
  processor.onaudioprocess = (event) => {
    const block = event.inputBuffer.getChannelData(0);
    paintLevel(block);
    const copy = new Float32Array(block.length);
    copy.set(block);
    chunks.push(copy);
    if (chunks.length * copy.length > context.sampleRate * MAX_SECONDS) {
      stop();
    }
  };
  source.connect(processor);
  processor.connect(sink);
  sink.connect(context.destination);
  started = performance.now();
  document.body.classList.remove("ready");
  document.body.classList.add("listening");
  report("listening");
}

function endStream() {
  clearInterval(partials);
  partials = null;
  fetch("/listen/stream-end", {
    method: "POST",
    headers: { Authorization: "Bearer " + token },
    keepalive: true,
  }).catch(() => {});
}

async function sendPartial() {
  if (!stream || !context || busy) {
    return;
  }
  const batch = chunks.slice(sentChunks);
  if (!batch.length) {
    return;
  }
  sentChunks = chunks.length;
  const total = batch.reduce((sum, chunk) => sum + chunk.length, 0);
  const merged = new Float32Array(total);
  let offset = 0;
  for (const chunk of batch) {
    merged.set(chunk, offset);
    offset += chunk.length;
  }
  try {
    const response = await fetch("/listen/stream", {
      method: "POST",
      headers: {
      "Content-Type": "audio/wav",
      Authorization: "Bearer " + token,
      "x-parlo-style": localStorage.getItem("parlo.style") || "",
    },
      body: encodeWav(downsample(merged, context.sampleRate, TARGET_RATE), TARGET_RATE),
    });
    if (!response.ok || busy) {
      return;
    }
    const pieces = await response.json();
    const last = pieces.filter((piece) => piece.text).pop();
    if (last && !busy) {
      lastText = last.text;
    }
  } catch (failure) {
    return;
  }
}

function release() {
  endStream();
  clearInterval(ticker);
  ticker = null;
  document.body.classList.remove("listening");
  bars.forEach((bar) => {
    bar.style.height = "3px";
  });
  if (processor) {
    processor.onaudioprocess = null;
    processor.disconnect();
  }
  if (source) {
    source.disconnect();
  }
  if (sink) {
    sink.disconnect();
  }
  if (stream) {
    stream.getTracks().forEach((track) => track.stop());
  }
  if (context && context.state !== "closed") {
    context.close();
  }
  const rate = context ? context.sampleRate : 48000;
  stream = null;
  context = null;
  source = null;
  processor = null;
  sink = null;
  const collected = chunks;
  chunks = [];
  const length = collected.reduce((total, chunk) => total + chunk.length, 0);
  if (!length) {
    return null;
  }
  const merged = new Float32Array(length);
  let offset = 0;
  for (const chunk of collected) {
    merged.set(chunk, offset);
    offset += chunk.length;
  }
  const seconds = length / rate;
  if (seconds < 0.2) {
    return null;
  }
  return { wav: encodeWav(downsample(merged, rate, TARGET_RATE), TARGET_RATE), seconds };
}

async function beginTarget() {
  try {
    const response = await fetch("/target", {
      headers: { Authorization: "Bearer " + token },
    });
    if (!response.ok) {
      return "";
    }
    const values = await response.json();
    return values.insertable ? values.app || "" : "";
  } catch (failure) {
    return "";
  }
}

async function loadSettings() {
  try {
    const response = await fetch("/settings", { cache: "no-store" });
    if (!response.ok) {
      return;
    }
    const values = await response.json();
    writeTarget = (values.write || "").toLowerCase();
  } catch (failure) {
    writeTarget = "";
  }
}

async function loadVersion() {
  try {
    const response = await fetch("/update", { cache: "no-store" });
    if (!response.ok) {
      return;
    }
    const update = await response.json();
    if (!update.available || !update.latest) {
      return;
    }
    setState("Ready", "v" + update.latest + " is available, you are on v" + version + ".", true);
  } catch (failure) {
    return;
  }
}

async function writeIntoField(text, signal) {
  if (!target) {
    return false;
  }
  try {
    const response = await fetch("/insert", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ text: text }),
      signal,
    });
    return response.ok;
  } catch (failure) {
    return false;
  }
}

function cancel() {
  const hadSomething = Boolean(stream) || busy;
  if (controller) {
    controller.abort();
    controller = null;
  }
  if (stream) {
    release();
  }
  busy = false;
  document.body.classList.remove("listening", "ready");
  if (hadSomething) {
    setState("Cancelled", "Nothing was inserted.", true);
  } else {
    setState("Ready", lastText || "Hold the shortcut to talk.", !lastText);
  }
  report("cancelled");
}

async function stop() {
  if (!stream || busy) {
    return;
  }
  busy = true;
  let failed = false;
  const captured = release();
  if (!captured) {
    setState("Ready", lastText || "Hold the shortcut to talk.", !lastText);
    busy = false;
    report("idle");
    return;
  }
  setState("Writing", "Your words are being written down.", true);
  report("processing");
  controller = new AbortController();
  const { signal } = controller;
  try {
    const headers = {
      "Content-Type": "audio/wav",
      Authorization: "Bearer " + token,
      "x-parlo-clean": tidy ? "on" : "off",
    };
    if (writeTarget) {
      headers["x-parlo-write"] = writeTarget;
    }
    const response = await fetch("/dictate", {
      method: "POST",
      headers,
      body: captured.wav,
      signal,
    });
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}));
      throw new Error(detail.error || "Parlo answered with status " + response.status + ".");
    }
    const result = await response.json();
    const spoken = (result.text || "").trim();
    const text = (result.translation || "").trim() || spoken;
    if (!text) {
      setState("Nothing heard", "Speak a little closer to the microphone.", true);
      busy = false;
      report("error");
      return;
    }
    lastText = text;
    const inserted = await writeIntoField(text, signal);
    setState(inserted ? "Inserted" : "Copied", text, false);
    if (!inserted) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (failure) {
        setState("Copied", "The clipboard refused the text, select it here and copy by hand.", true);
      }
    }
  } catch (failure) {
    if (signal.aborted) {
      setState("Ready", "Cancelled. Nothing was inserted.", true);
    } else {
      setState("Failed", failure.message || "The dictation failed.", true);
    }
    failed = true;
  }
  controller = null;
  busy = false;
  report(failed ? (signal.aborted ? "cancelled" : "error") : "success");
}

function handsFree() {
  begin();
}

function arm() {
  document.body.classList.remove("ready", "listening");
  setState("Ready", "Hold the shortcut to talk.", true);
  report("armed");
}

function ready() {
  if (stream || busy) {
    return;
  }
  document.body.classList.add("ready");
  document.body.classList.remove("listening");
  report("armed");
}

function paintTidy() {
  tidyEl.setAttribute("aria-checked", String(tidy));
}

tidyEl.addEventListener("click", () => {
  tidy = !tidy;
  localStorage.setItem("parlo-tidy", tidy ? "on" : "off");
  paintTidy();
});

recordEl.addEventListener("click", () => {
  begin();
});

paintTidy();

window.parloArm = arm;
window.parloReady = ready;
window.parloBegin = begin;
window.parloStop = stop;
window.parloCancel = cancel;
window.parloHandsFree = handsFree;

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    ready();
  }
});

window.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    event.preventDefault();
    cancel();
  }
});

loadVersion();
loadSettings();
if (!document.hidden) {
  ready();
}
</script>
</body>
</html>
