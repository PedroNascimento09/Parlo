<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="parlo-version" content="__PARLO_VERSION__">
<meta name="color-scheme" content="light dark">
<title>Parlo Dictate</title>
<style>
  :root {
    --shell: rgba(255, 253, 248, 0.94);
    --ink: #191512;
    --muted: #6f6559;
    --line: rgba(25, 21, 18, 0.12);
    --accent: #2f6b4f;
    --accent-ink: #fbf9f2;
    --track: rgba(25, 21, 18, 0.1);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --shell: rgba(19, 17, 14, 0.94);
      --ink: #f4efe4;
      --muted: #9c9284;
      --line: rgba(244, 239, 228, 0.14);
      --accent: #9ed9b4;
      --accent-ink: #10201a;
      --track: rgba(244, 239, 228, 0.12);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; }
  body {
    display: grid;
    align-items: center;
    justify-items: center;
    padding: 8px;
    font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .island {
    display: flex;
    align-items: center;
    gap: 12px;
    width: max-content;
    max-width: 100%;
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--shell);
    box-shadow: 0 14px 34px rgba(24, 18, 12, 0.16);
    backdrop-filter: blur(20px) saturate(140%);
    animation: settle 160ms cubic-bezier(0.2, 0.9, 0.3, 1) both;
  }
  body.ready .island { gap: 18px; padding: 12px 14px 12px 18px; }
  .wave {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 20px;
    width: 26px;
    transition: width 160ms ease;
  }
  .wave i {
    display: block;
    width: 2px;
    height: 4px;
    border-radius: 2px;
    background: var(--muted);
    transition: height 90ms linear, background 160ms ease;
  }
  body.listening .wave { width: 52px; gap: 4px; }
  body.listening .wave i { background: var(--accent); }
  .clock {
    display: none;
    min-width: 34px;
    font-family: "Bahnschrift", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.06em;
    text-align: right;
    color: var(--muted);
  }
  body.listening .clock { display: block; }
  body.paused .clock { color: var(--accent); }
  .pause {
    display: none;
    font: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  body.listening .pause { display: block; }
  .pause:hover { background: var(--line); color: var(--ink); }
  .pause:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stop {
    display: none;
    font: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 14px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    transition: filter 140ms ease;
  }
  body.listening .stop { display: block; }
  .stop:hover { filter: brightness(0.94); }
  .stop:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .readout {
    display: grid;
    gap: 2px;
    min-width: 0;
    max-width: 360px;
  }
  body.ready .readout,
  body.listening .readout,
  body.listening .actions { display: none; }
  .state {
    font-family: "Bahnschrift", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .line {
    font-family: "Sitka Text", "Sitka Heading", "Iowan Old Style", Georgia, serif;
    font-size: 15px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .line.pending {
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    color: var(--muted);
  }
  .actions {
    display: none;
    align-items: center;
    gap: 10px;
  }
  body.ready .actions { display: flex; }
  .write {
    position: relative;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--track);
  }
  .write-label {
    padding: 0 8px 0 7px;
    font-family: "Bahnschrift", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .write-btn {
    font: inherit;
    font-size: 11.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 9px 5px 10px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background 140ms ease;
  }
  .write-btn:hover,
  .write-btn[aria-expanded="true"] {
    background: var(--line);
  }
  .write-btn::after {
    content: "";
    width: 5px;
    height: 5px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    transform: rotate(45deg) translate(-1px, -1px);
    transition: transform 140ms ease;
  }
  .write-btn[aria-expanded="true"]::after {
    transform: rotate(225deg) translate(-1px, -1px);
  }
  .write-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .write-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    min-width: 190px;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #0e1011;
    box-shadow: 0 18px 34px rgba(0, 0, 0, 0.45);
    display: grid;
    gap: 2px;
    z-index: 5;
    animation: menuIn 130ms cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .write-menu[hidden] {
    display: none;
  }
  .write-option {
    font: inherit;
    font-size: 12.5px;
    text-align: left;
    padding: 7px 10px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .write-option:hover,
  .write-option:focus-visible {
    background: rgba(255, 255, 255, 0.06);
    color: var(--ink);
    outline: none;
  }
  .write-option[aria-selected="true"] {
    color: var(--accent);
  }
  @keyframes menuIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }
  .switch-label {
    font-family: "Bahnschrift", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .rule {
    width: 1px;
    height: 18px;
    background: var(--line);
  }
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--track);
    cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease;
  }
  .switch[aria-checked="true"] {
    background: var(--accent);
    border-color: var(--accent);
  }
  .switch .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--ink);
    transition: transform 160ms cubic-bezier(0.2, 0.9, 0.3, 1), background 160ms ease;
  }
  .switch[aria-checked="true"] .knob {
    transform: translateX(18px);
    background: var(--accent-ink);
  }
  .switch:focus-visible,
  .record:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .record {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 16px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  @keyframes settle {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .island, .switch, .switch .knob, .wave, .wave i, .write-menu, .write-btn, .write-option, .stop { animation: none; transition: none; }
  }
</style>
</head>
<body>
  <div class="island">
    <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <span class="clock" id="clock" aria-hidden="true">0:00</span>
    <button type="button" class="pause" id="pause" aria-pressed="false">Pause</button>
    <button type="button" class="stop" id="stop">Stop</button>
    <div class="readout">
      <span class="state" id="state">Ready</span>
      <span class="line pending" id="line">Hold the shortcut to talk.</span>
    </div>
    <div class="actions">
      <div class="write" role="group" aria-label="Write in">
        <span class="write-label">Write</span>
        <button type="button" class="write-btn" id="write" aria-haspopup="listbox" aria-expanded="false" aria-label="Dictation writes">
          <span id="write-name">Spoken language</span>
        </button>
        <div class="write-menu" id="write-menu" role="listbox" aria-label="Dictation writes" hidden></div>
      </div>
      <span class="rule" aria-hidden="true"></span>
      <span class="switch-label" id="tidy-label">Clean</span>
      <button type="button" class="switch" id="tidy" role="switch" aria-checked="true" aria-labelledby="tidy-label" title="Removes filler words and repeats before writing">
        <span class="knob"></span>
      </button>
      <button type="button" class="record" id="record">Record</button>
    </div>
  </div>
<script src="languages.js"></script>
<script>
const token = new URLSearchParams(location.search).get("t") || "";
const TARGET_RATE = 16000;
const MAX_SECONDS = 60;
const WEIGHTS = [0.55, 0.9, 1, 0.75, 0.95, 0.6, 0.8];

const stateEl = document.getElementById("state");
const lineEl = document.getElementById("line");
const tidyEl = document.getElementById("tidy");
const recordEl = document.getElementById("record");
const bars = [...document.querySelectorAll(".wave i")];
const clockEl = document.getElementById("clock");
const pauseEl = document.getElementById("pause");
const version = document.querySelector('meta[name="parlo-version"]').content;

let stream = null;
let context = null;
let source = null;
let processor = null;
let sink = null;
let chunks = [];
let started = 0;
let ticker = null;
let clockTimer = null;
let paused = false;
let pausedAt = 0;
let pausedTotal = 0;
let busy = false;
let lastText = "";
let target = false;
let writeTarget = "";
let writeSource = "";
let writePairs = [];
let writeNames = {};
let writeChoice = localStorage.getItem("parlo-write");
if (writeChoice === "same") {
  writeChoice = "";
  localStorage.setItem("parlo-write", "");
}
let controller = null;
let sentChunks = 0;
let partials = null;
let tidy = localStorage.getItem("parlo-tidy") !== "off";

function setState(text, line, pending) {
  stateEl.textContent = text;
  if (line !== undefined) {
    lineEl.textContent = line;
    lineEl.classList.toggle("pending", Boolean(pending));
  }
}

function report(state) {
  fetch("/state", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: JSON.stringify({ state }),
    keepalive: true,
  }).catch(() => {});
}

function describeMicrophone(failure) {
  const name = failure && failure.name;
  if (name === "NotAllowedError") {
    return "The microphone is blocked. Allow it in the Parlo window and try again.";
  }
  if (name === "NotFoundError") {
    return "No microphone was found. Plug one in and try again.";
  }
  return "The microphone did not open. Check that another program is not using it.";
}

function downsample(samples, from, to) {
  if (from === to) {
    return samples;
  }
  const ratio = from / to;
  const length = Math.max(Math.floor(samples.length / ratio), 1);
  const out = new Float32Array(length);
  for (let index = 0; index < length; index += 1) {
    const start = Math.floor(index * ratio);
    const end = Math.min(Math.floor((index + 1) * ratio), samples.length);
    let sum = 0;
    let count = 0;
    for (let cursor = start; cursor < end; cursor += 1) {
      sum += samples[cursor];
      count += 1;
    }
    out[index] = count ? sum / count : 0;
  }
  return out;
}

function encodeWav(samples, rate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const text = (offset, value) => {
    for (let index = 0; index < value.length; index += 1) {
      view.setUint8(offset + index, value.charCodeAt(index));
    }
  };
  text(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  text(8, "WAVE");
  text(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, rate, true);
  view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  text(36, "data");
  view.setUint32(40, samples.length * 2, true);
  for (let index = 0; index < samples.length; index += 1) {
    const value = Math.max(-1, Math.min(1, samples[index]));
    view.setInt16(44 + index * 2, value * 32767, true);
  }
  return new Blob([buffer], { type: "audio/wav" });
}

function paintLevel(block) {
  let peak = 0;
  for (let index = 0; index < block.length; index += 1) {
    const value = Math.abs(block[index]);
    if (value > peak) {
      peak = value;
    }
  }
  bars.forEach((bar, index) => {
    const height = Math.min(18, 3 + peak * 90 * WEIGHTS[index]);
    bar.style.height = height.toFixed(1) + "px";
  });
}

async function begin() {
  if (busy || stream) {
    return;
  }
  const app = await beginTarget();
  target = Boolean(app);
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (failure) {
    document.body.classList.remove("ready");
    setState("Microphone blocked", describeMicrophone(failure), true);
    report("error");
    return;
  }
  context = new (window.AudioContext || window.webkitAudioContext)();
  source = context.createMediaStreamSource(stream);
  processor = context.createScriptProcessor(2048, 1, 1);
  sink = context.createGain();
  sink.gain.value = 0;
  chunks = [];
  sentChunks = 0;
  clearInterval(partials);
  partials = setInterval(sendPartial, 800);
  processor.onaudioprocess = (event) => {
    if (paused) {
      return;
    }
    const block = event.inputBuffer.getChannelData(0);
    paintLevel(block);
    const copy = new Float32Array(block.length);
    copy.set(block);
    chunks.push(copy);
    if (chunks.length * copy.length > context.sampleRate * MAX_SECONDS) {
      stop();
    }
  };
  source.connect(processor);
  processor.connect(sink);
  sink.connect(context.destination);
  started = performance.now();
  paused = false;
  pausedAt = 0;
  pausedTotal = 0;
  clearInterval(clockTimer);
  clockTimer = setInterval(paintClock, 250);
  paintClock();
  paintPause();
  document.body.classList.remove("ready", "paused");
  document.body.classList.add("listening");
  report("listening");
}

function endStream() {
  clearInterval(partials);
  partials = null;
  fetch("/listen/stream-end", {
    method: "POST",
    headers: { Authorization: "Bearer " + token },
    keepalive: true,
  }).catch(() => {});
}

async function sendPartial() {
  if (!stream || !context || busy || paused) {
    return;
  }
  const batch = chunks.slice(sentChunks);
  if (!batch.length) {
    return;
  }
  sentChunks = chunks.length;
  const total = batch.reduce((sum, chunk) => sum + chunk.length, 0);
  const merged = new Float32Array(total);
  let offset = 0;
  for (const chunk of batch) {
    merged.set(chunk, offset);
    offset += chunk.length;
  }
  try {
    const response = await fetch("/listen/stream", {
      method: "POST",
      headers: {
      "Content-Type": "audio/wav",
      Authorization: "Bearer " + token,
      "x-parlo-style": localStorage.getItem("parlo.style") || "",
    },
      body: encodeWav(downsample(merged, context.sampleRate, TARGET_RATE), TARGET_RATE),
    });
    if (!response.ok || busy) {
      return;
    }
    const pieces = await response.json();
    const last = pieces.filter((piece) => piece.text).pop();
    if (last && !busy) {
      lastText = last.text;
    }
  } catch (failure) {
    return;
  }
}

function elapsedSeconds() {
  const now = paused ? pausedAt : performance.now();
  return Math.max(0, (now - started - pausedTotal) / 1000);
}

function paintClock() {
  const whole = Math.floor(elapsedSeconds());
  clockEl.textContent = Math.floor(whole / 60) + ":" + String(whole % 60).padStart(2, "0");
}

function paintPause() {
  pauseEl.textContent = paused ? "Resume" : "Pause";
  pauseEl.setAttribute("aria-pressed", String(paused));
  document.body.classList.toggle("paused", paused);
}

function pause() {
  if (!stream || busy || paused) {
    return;
  }
  paused = true;
  pausedAt = performance.now();
  clearInterval(partials);
  partials = null;
  bars.forEach((bar) => {
    bar.style.height = "3px";
  });
  paintClock();
  paintPause();
  report("paused");
}

function resume() {
  if (!paused) {
    return;
  }
  pausedTotal += performance.now() - pausedAt;
  pausedAt = 0;
  paused = false;
  if (stream && !partials) {
    partials = setInterval(sendPartial, 800);
  }
  paintPause();
  paintClock();
  report("listening");
}

function togglePause() {
  if (paused) {
    resume();
  } else {
    pause();
  }
}

function release() {
  clearInterval(clockTimer);
  clockTimer = null;
  paused = false;
  pausedAt = 0;
  pausedTotal = 0;
  paintPause();
  endStream();
  clearInterval(ticker);
  ticker = null;
  document.body.classList.remove("listening");
  bars.forEach((bar) => {
    bar.style.height = "3px";
  });
  if (processor) {
    processor.onaudioprocess = null;
    processor.disconnect();
  }
  if (source) {
    source.disconnect();
  }
  if (sink) {
    sink.disconnect();
  }
  if (stream) {
    stream.getTracks().forEach((track) => track.stop());
  }
  if (context && context.state !== "closed") {
    context.close();
  }
  const rate = context ? context.sampleRate : 48000;
  stream = null;
  context = null;
  source = null;
  processor = null;
  sink = null;
  const collected = chunks;
  chunks = [];
  const length = collected.reduce((total, chunk) => total + chunk.length, 0);
  if (!length) {
    return null;
  }
  const merged = new Float32Array(length);
  let offset = 0;
  for (const chunk of collected) {
    merged.set(chunk, offset);
    offset += chunk.length;
  }
  const seconds = length / rate;
  if (seconds < 0.2) {
    return null;
  }
  return { wav: encodeWav(downsample(merged, rate, TARGET_RATE), TARGET_RATE), seconds };
}

async function beginTarget() {
  try {
    const response = await fetch("/target", {
      headers: { Authorization: "Bearer " + token },
    });
    if (!response.ok) {
      return "";
    }
    const values = await response.json();
    return values.insertable ? values.app || "" : "";
  } catch (failure) {
    return "";
  }
}

async function loadSettings() {
  try {
    const response = await fetch("/settings", { cache: "no-store" });
    if (!response.ok) {
      return;
    }
    const values = await response.json();
    writeTarget = (values.write || "").toLowerCase();
    writeSource = (values.from || "").toLowerCase();
  } catch (failure) {
    writeTarget = "";
  }
  paintWrite();
}

async function loadVersion() {
  try {
    const response = await fetch("/update", { cache: "no-store" });
    if (!response.ok) {
      return;
    }
    const update = await response.json();
    if (!update.available || !update.latest) {
      return;
    }
    setState("Ready", "v" + update.latest + " is available, you are on v" + version + ".", true);
  } catch (failure) {
    return;
  }
}

async function writeIntoField(text, signal) {
  if (!target) {
    return false;
  }
  try {
    const response = await fetch("/insert", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ text: text }),
      signal,
    });
    return response.ok;
  } catch (failure) {
    return false;
  }
}

function cancel() {
  const hadSomething = Boolean(stream) || busy;
  if (controller) {
    controller.abort();
    controller = null;
  }
  if (stream) {
    release();
  }
  busy = false;
  document.body.classList.remove("listening", "ready");
  if (hadSomething) {
    setState("Cancelled", "Nothing was inserted.", true);
  } else {
    setState("Ready", lastText || "Hold the shortcut to talk.", !lastText);
  }
  report("cancelled");
}

async function stop() {
  if (!stream || busy) {
    return;
  }
  busy = true;
  let failed = false;
  const captured = release();
  if (!captured) {
    setState("Ready", lastText || "Hold the shortcut to talk.", !lastText);
    busy = false;
    report("idle");
    return;
  }
  setState("Cleaning up", "Polishing the sentence.", true);
  report("processing");
  controller = new AbortController();
  const { signal } = controller;
  try {
    const headers = {
      "Content-Type": "audio/wav",
      Authorization: "Bearer " + token,
      "x-parlo-clean": tidy ? "on" : "off",
    };
    const write = effectiveWrite();
    if (write) {
      headers["x-parlo-write"] = write;
    }
    const response = await fetch("/dictate", {
      method: "POST",
      headers,
      body: captured.wav,
      signal,
    });
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}));
      throw new Error(detail.error || "Parlo answered with status " + response.status + ".");
    }
    const result = await response.json();
    const spoken = (result.text || "").trim();
    const text = (result.translation || "").trim() || spoken;
    if (!text) {
      setState("Nothing heard", "Speak a little closer to the microphone.", true);
      busy = false;
      report("error");
      return;
    }
    lastText = text;
    const inserted = await writeIntoField(text, signal);
    setState(inserted ? "Written" : "Copied", text, false);
    if (!inserted) {
      try {
        const response = await fetch("/clipboard", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ text }),
          signal,
        });
        if (!response.ok) {
          throw new Error("the server clipboard refused the text");
        }
        const copied = await response.json();
        setState(
          "Copied",
          "Copied. Your previous clipboard returns in " + (copied.lease_seconds || 10) + " seconds.",
          false
        );
      } catch (failure) {
        if (!signal.aborted) {
          try {
            await navigator.clipboard.writeText(text);
          } catch (copyFailure) {
            setState("Copied", "The clipboard refused the text, select it here and copy by hand.", true);
          }
        }
      }
    }
  } catch (failure) {
    if (signal.aborted) {
      setState("Ready", "Cancelled. Nothing was inserted.", true);
    } else {
      setState("Failed", failure.message || "The dictation failed.", true);
    }
    failed = true;
  }
  controller = null;
  busy = false;
  report(failed ? (signal.aborted ? "cancelled" : "error") : "success");
}

function handsFree() {
  begin();
}

function arm() {
  document.body.classList.remove("ready", "listening");
  setState("Ready", "Hold the shortcut to talk.", true);
  report("armed");
}

function ready() {
  if (stream || busy) {
    return;
  }
  document.body.classList.add("ready");
  document.body.classList.remove("listening");
  report("armed");
}

function paintTidy() {
  tidyEl.setAttribute("aria-checked", String(tidy));
}

const writeEl = document.getElementById("write");
const writeMenu = document.getElementById("write-menu");
const writeName = document.getElementById("write-name");

function writableTargets() {
  return writeTargets(writePairs, writeNames, writeSource);
}

function writeOptions() {
  return [{ code: "", name: "Spoken language" }].concat(
    writableTargets().map((code) => ({ code, name: writeNames[code] || code.toUpperCase() })),
  );
}

function effectiveWrite() {
  const chosen = writeChoice === null ? writeTarget : writeChoice;
  return writeOptions().some((option) => option.code === chosen) ? chosen : "";
}

function paintWrite() {
  const active = effectiveWrite();
  const shown = writeOptions().find((option) => option.code === active);
  writeName.textContent = shown ? shown.name : "Spoken language";
  for (const item of writeMenu.children) {
    item.setAttribute("aria-selected", String(item.dataset.code === active));
  }
}

function openWriteMenu(open) {
  writeMenu.hidden = !open;
  writeEl.setAttribute("aria-expanded", String(open));
  if (!open) {
    return;
  }
  const active = writeMenu.querySelector('[aria-selected="true"]') || writeMenu.firstElementChild;
  if (active) {
    active.focus();
  }
}

function chooseWrite(code) {
  writeChoice = code;
  localStorage.setItem("parlo-write", writeChoice);
  openWriteMenu(false);
  paintWrite();
  writeEl.focus();
  setState(
    "Ready",
    code ? "Writes " + (writeNames[code] || code.toUpperCase()) + " until you change it." : "Writes the language you speak.",
    true,
  );
}

function buildWriteMenu() {
  writeMenu.replaceChildren();
  for (const option of writeOptions()) {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "write-option";
    item.dataset.code = option.code;
    item.setAttribute("role", "option");
    item.textContent = option.name;
    item.addEventListener("click", () => chooseWrite(option.code));
    writeMenu.append(item);
  }
  paintWrite();
}

async function loadLanguages() {
  try {
    const response = await fetch("/languages.json", { cache: "no-store" });
    if (!response.ok) {
      return;
    }
    const table = await response.json();
    writePairs = Array.isArray(table.pairs) ? table.pairs : [];
    writeNames = table.names || {};
  } catch (failure) {
    writePairs = [];
  }
  buildWriteMenu();
}

writeEl.addEventListener("click", () => openWriteMenu(writeMenu.hidden));
writeEl.addEventListener("keydown", (event) => {
  if (event.key === "ArrowDown" || event.key === "ArrowUp" || event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    openWriteMenu(true);
  }
});
writeMenu.addEventListener("keydown", (event) => {
  const items = [...writeMenu.children];
  const at = items.indexOf(document.activeElement);
  if (event.key === "Escape") {
    event.preventDefault();
    openWriteMenu(false);
    writeEl.focus();
    return;
  }
  if (event.key === "ArrowDown") {
    event.preventDefault();
    items[Math.min(at + 1, items.length - 1)].focus();
  }
  if (event.key === "ArrowUp") {
    event.preventDefault();
    items[Math.max(at - 1, 0)].focus();
  }
});
writeMenu.addEventListener("focusout", (event) => {
  if (!writeMenu.contains(event.relatedTarget) && event.relatedTarget !== writeEl) {
    openWriteMenu(false);
  }
});

tidyEl.addEventListener("click", () => {
  tidy = !tidy;
  localStorage.setItem("parlo-tidy", tidy ? "on" : "off");
  paintTidy();
});

recordEl.addEventListener("click", () => {
  begin();
});

document.getElementById("stop").addEventListener("click", () => {
  stop();
});

paintTidy();
paintWrite();

window.parloArm = arm;
window.parloReady = ready;
window.parloBegin = begin;
window.parloStop = stop;
window.parloCancel = cancel;
window.parloHandsFree = handsFree;

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    ready();
  }
});

pauseEl.addEventListener("click", togglePause);

window.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    event.preventDefault();
    cancel();
  }
  if (event.key === " " && stream && !(event.target instanceof HTMLButtonElement)) {
    event.preventDefault();
    togglePause();
  }
});

loadVersion();
loadSettings();
loadLanguages();
if (!document.hidden) {
  ready();
}
</script>
</body>
</html>
