<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="parlo-version" content="__PARLO_VERSION__">
<meta name="color-scheme" content="light dark">
<title>Parlo Dictate</title>
<style>
  :root {
    --surface: rgba(255, 253, 248, 0.98);
    --ink: #1b1712;
    --muted: #6b6257;
    --line: rgba(27, 23, 18, 0.12);
    --line-strong: rgba(27, 23, 18, 0.2);
    --accent: #2f6b4f;
    --accent-ink: #fbf9f2;
    --track: #f3ecdf;
    --menu: #fffdf8;
    --shadow: 0 18px 40px rgba(24, 18, 12, 0.16);
    --shadow-menu: 0 18px 40px rgba(24, 18, 12, 0.18);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: rgba(25, 22, 18, 0.98);
      --ink: #f4efe4;
      --muted: #a49a8c;
      --line: rgba(244, 239, 228, 0.14);
      --line-strong: rgba(244, 239, 228, 0.24);
      --accent: #9ed9b4;
      --accent-ink: #10201a;
      --track: #2a251f;
      --menu: #1d1915;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
      --shadow-menu: 0 18px 40px rgba(0, 0, 0, 0.58);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: transparent;
    overflow: hidden;
  }
  body {
    display: grid;
    grid-template-rows: minmax(0, 1fr) 132px;
    align-items: center;
    justify-items: center;
    padding: 0 8px;
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  body.menu-down {
    grid-template-rows: 132px minmax(0, 1fr);
  }
  .island {
    grid-row: 2;
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    width: max-content;
    max-width: calc(100vw - 16px);
    min-height: 54px;
    padding: 10px 12px 10px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--shadow);
    transition: border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
  }
  body.menu-down .island { grid-row: 1; }
  body.listening .island {
    gap: 14px;
    padding-right: 10px;
  }
  .wave {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    width: 24px;
    height: 20px;
    transition: width 160ms ease, gap 160ms ease;
  }
  .wave i {
    display: block;
    width: 2px;
    height: 18px;
    border-radius: 2px;
    background: var(--muted);
    transform: scaleY(0.22);
    transform-origin: center;
    transition: transform 80ms linear, background 160ms ease, opacity 160ms ease;
  }
  body.ready .wave i {
    animation: breathe 2.6s ease-in-out infinite;
  }
  body.ready .wave i:nth-child(2) { animation-delay: 120ms; }
  body.ready .wave i:nth-child(3) { animation-delay: 240ms; }
  body.ready .wave i:nth-child(4) { animation-delay: 360ms; }
  body.ready .wave i:nth-child(5) { animation-delay: 480ms; }
  body.ready .wave i:nth-child(6) { animation-delay: 600ms; }
  body.ready .wave i:nth-child(7) { animation-delay: 720ms; }
  body.listening .wave {
    width: 46px;
    gap: 4px;
  }
  body.listening .wave i,
  body.paused .wave i {
    background: var(--accent);
    animation: none;
  }
  body.paused .wave i { opacity: 0.55; }
  .readout {
    flex: 1 1 auto;
    display: grid;
    gap: 3px;
    min-width: 0;
    max-width: 520px;
  }
  body.ready .readout { display: none; }
  .hint {
    font-size: 10.5px;
    line-height: 1.35;
    color: var(--muted);
  }
  .state {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 12px;
    font-family: "Bahnschrift", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    line-height: 1;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 160ms ease;
  }
  .state::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.5;
    transition: opacity 160ms ease, transform 160ms ease;
  }
  body.listening .state { color: var(--accent); }
  body.listening .state::before {
    opacity: 1;
    animation: pulse 1.4s ease-in-out infinite;
  }
  body.paused .state::before {
    animation: none;
    opacity: 0.7;
  }
  .line {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    overflow-wrap: anywhere;
    font-family: "Sitka Text", "Sitka Heading", "Iowan Old Style", Georgia, serif;
    font-size: 15px;
    line-height: 1.3;
    color: var(--ink);
    transition: color 160ms ease;
  }
  .line.pending {
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.35;
    color: var(--muted);
  }
  .actions {
    flex: 0 0 auto;
    display: none;
    align-items: center;
    gap: 8px;
  }
  body.ready .actions,
  body.listening .actions,
  body.recovery .actions {
    display: flex;
  }
  .pause,
  .stop,
  .copy-recovery {
    display: none;
    align-items: center;
    justify-content: center;
    height: 28px;
    padding: 0 11px;
    border-radius: 999px;
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: background 140ms ease, color 140ms ease, border-color 140ms ease, transform 120ms ease;
  }
  body.listening .pause,
  body.listening .stop {
    display: inline-flex;
  }
  .pause {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
  }
  .pause:hover {
    background: var(--track);
    color: var(--ink);
  }
  .stop {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
  }
  .stop:hover { filter: brightness(0.95); }
  body.recovery .copy-recovery { display: inline-flex; }
  body.recovery .record { display: inline-flex; }
  .copy-recovery {
    border: 1px solid var(--line-strong);
    background: var(--track);
    color: var(--ink);
  }
  .copy-recovery:hover { border-color: var(--accent); }
  .recovery-text {
    display: block;
    max-height: 6.75em;
    overflow: auto;
    color: var(--ink);
    font-size: 13px;
    line-height: 1.35;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    user-select: text;
  }
  body.recovery { grid-template-rows: minmax(0, 1fr) auto; padding-bottom: 8px; }
  body.recovery .island { border-radius: 22px; }
  body.recovery.menu-down { grid-template-rows: auto minmax(0, 1fr); }
  .clear-recovery { display: none; }
  body.recovery .clear-recovery { display: inline-flex; }
  .clear-recovery {
    align-items: center;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    padding: 6px 10px;
    cursor: pointer;
  }
  .clear-recovery:focus-visible, .recovery-text:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .recovery-text[hidden],
  .copy-recovery[hidden],
  .clear-recovery[hidden] { display: none; }
  .pause:active,
  .stop:active,
  .copy-recovery:active,
  .record:active,
  .write-btn:active,
  .dismiss:active {
    transform: scale(0.97);
  }
  .write {
    position: relative;
    display: none;
    align-items: center;
  }
  body.ready .write { display: flex; }
  .write-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    max-width: 132px;
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease, transform 120ms ease;
  }
  .write-btn:hover,
  .write-btn[aria-expanded="true"] {
    background: var(--track);
    border-color: var(--line-strong);
  }
  .write-btn span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .write-btn::after {
    content: "";
    flex: 0 0 auto;
    width: 5px;
    height: 5px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    transform: rotate(45deg) translate(-1px, -1px);
    transition: transform 140ms ease;
  }
  .write-btn[aria-expanded="true"]::after {
    transform: rotate(225deg) translate(-1px, -1px);
  }
  .write-menu {
    position: absolute;
    right: 0;
    bottom: calc(100% + 10px);
    z-index: 20;
    display: grid;
    gap: 2px;
    grid-auto-rows: min-content;
    min-width: 220px;
    max-height: min(252px, calc(100vh - 112px));
    padding: 6px;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--menu);
    box-shadow: var(--shadow-menu);
    transform-origin: bottom right;
    animation: menuIn 140ms cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  body.menu-down .write-menu {
    top: calc(100% + 10px);
    bottom: auto;
    transform-origin: top right;
    animation-name: menuDownIn;
  }
  .write-menu[hidden] { display: none; }
  .write-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12.5px;
    text-align: left;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .write-option::before {
    content: "";
    flex: 0 0 auto;
    width: 12px;
    color: var(--accent);
  }
  .write-option[aria-selected="true"] {
    color: var(--accent);
  }
  .write-option[aria-selected="true"]::before {
    content: "✓";
  }
  .write-option:hover,
  .write-option:focus-visible {
    background: var(--track);
    color: var(--ink);
  }
  .write-option:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .write-option.needs-download::after {
    content: "download";
    margin-left: auto;
    color: var(--accent);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .tidy,
  .whisper {
    display: none;
    align-items: center;
    gap: 7px;
  }
  body.ready .tidy,
  body.ready .whisper { display: flex; }
  .switch-label {
    font-family: "Bahnschrift", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .switch {
    position: relative;
    width: 34px;
    height: 20px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--track);
    cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease;
  }
  .switch[aria-checked="true"] {
    border-color: var(--accent);
    background: var(--accent);
  }
  .switch .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--ink);
    transition: transform 160ms cubic-bezier(0.2, 0.9, 0.3, 1), background 160ms ease;
  }
  .switch[aria-checked="true"] .knob {
    transform: translateX(14px);
    background: var(--accent-ink);
  }
  .record {
    display: none;
    align-items: center;
    justify-content: center;
    height: 28px;
    padding: 0 13px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 140ms ease, transform 120ms ease;
  }
  body.ready .record { display: inline-flex; }
  .record:hover { filter: brightness(0.95); }
  .dismiss {
    flex: 0 0 28px;
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition: background 140ms ease, color 140ms ease, transform 120ms ease;
  }
  .dismiss:hover {
    background: var(--track);
    color: var(--ink);
  }
  .write-btn:focus-visible,
  .pause:focus-visible,
  .stop:focus-visible,
  .copy-recovery:focus-visible,
  .switch:focus-visible,
  .record:focus-visible,
  .dismiss:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  @keyframes breathe {
    0%, 100% { transform: scaleY(0.22); opacity: 0.55; }
    50% { transform: scaleY(0.4); opacity: 0.9; }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.45); opacity: 0.55; }
  }
  @keyframes menuIn {
    from { opacity: 0; transform: translateY(4px) scale(0.985); }
    to { opacity: 1; transform: none; }
  }
  @keyframes menuDownIn {
    from { opacity: 0; transform: translateY(-4px) scale(0.985); }
    to { opacity: 1; transform: none; }
  }
  @media (max-width: 540px) {
    .island {
      width: auto;
      max-width: calc(100vw - 16px);
      flex-wrap: wrap;
      gap: 9px;
      padding: 10px 12px;
      border-radius: 22px;
    }
    .readout {
      flex-basis: 100%;
      order: 2;
    }
    .actions {
      order: 3;
      flex-wrap: wrap;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .island,
    .wave,
    .wave i,
    .readout,
    .state,
    .state::before,
    .line,
    .pause,
    .stop,
    .copy-recovery,
    .write-btn,
    .write-menu,
    .write-option,
    .tidy,
    .whisper,
    .switch,
    .switch .knob,
    .record,
    .dismiss {
      animation: none;
      transition: none;
    }
  }
</style>
</head>
<body class="ready">
  <div class="island" id="island">
    <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <div class="readout">
      <span class="state" id="state" role="status" aria-live="polite" aria-atomic="true"></span>
      <span class="line pending" id="line" role="status" aria-live="polite" aria-atomic="true"></span>
      <span class="recovery-text" id="recovery-text" role="region" aria-label="Dictation result" tabindex="0" hidden></span>
      <span class="hint" id="hint" role="status" aria-live="polite" hidden data-i18n="island.firstLoad">The first dictation after a start loads the engine, so it can take a few seconds longer.</span>
    </div>
    <div class="actions">
      <button type="button" class="copy-recovery" id="copy-recovery" aria-keyshortcuts="Control+Enter" title="Copy text (Ctrl+Enter)">Copy text</button>
      <button type="button" class="clear-recovery" id="clear-recovery" hidden>Discard</button>
      <button type="button" class="pause" id="pause" aria-pressed="false" data-i18n="island.pause">Pause</button>
      <button type="button" class="stop" id="stop" data-i18n="island.stop">Stop</button>
      <div class="write" role="group" aria-label="Write in" data-i18n-aria-label="island.writeIn">
        <button type="button" class="write-btn" id="write" aria-haspopup="listbox" aria-expanded="false" aria-label="Dictation writes" data-i18n-aria-label="island.dictationWrites">
          <span id="write-name" data-i18n="island.spokenLanguage">Spoken language</span>
        </button>
        <div class="write-menu" id="write-menu" role="listbox" aria-label="Dictation writes" data-i18n-aria-label="island.dictationWrites" hidden></div>
      </div>
      <div class="tidy">
        <span class="switch-label" id="tidy-label" data-i18n="island.cleanup">Polish</span>
        <span class="tidy-hint sr-only" id="tidy-hint" data-i18n="island.drops">Drops filler and repeats</span>
        <button type="button" class="switch" id="tidy" role="switch" aria-checked="false" aria-labelledby="tidy-label" aria-describedby="tidy-hint">
          <span class="knob"></span>
        </button>
      </div>
      <div class="whisper">
        <span class="switch-label" id="whisper-label">Whisper</span>
        <span class="whisper-hint sr-only" id="whisper-hint">Raises the microphone gain for quiet speech</span>
        <button type="button" class="switch" id="whisper" role="switch" aria-checked="false" aria-labelledby="whisper-label" aria-describedby="whisper-hint">
          <span class="knob"></span>
        </button>
      </div>
      <button type="button" class="record" id="record" data-i18n="island.record">Record</button>
    </div>
    <button type="button" class="dismiss" id="dismiss" aria-label="Close" data-i18n-aria-label="island.close">×</button>
  </div>
<script src="languages.js"></script>
<script>
const token = new URLSearchParams(location.search).get("t") || "";
document.addEventListener("contextmenu", (event) => event.preventDefault());
let strings = {};

function t(key, fallback, values = {}) {
  const text = strings[key] || fallback;
  return Object.entries(values).reduce(
    (out, [name, value]) => out.split("{" + name + "}").join(String(value)),
    text,
  );
}

function applyText() {
  document.title = t("island.title", "Parlo Dictate");
  for (const element of document.querySelectorAll("[data-i18n]")) {
    element.textContent = t(element.dataset.i18n, element.textContent);
  }
  for (const element of document.querySelectorAll("[data-i18n-aria-label]")) {
    element.setAttribute("aria-label", t(element.dataset.i18nAriaLabel, element.getAttribute("aria-label")));
  }
}

const TARGET_RATE = 16000;
const ISLAND_HEIGHT = 132;
const ISLAND_OPEN_HEIGHT = 372;
const MAX_SECONDS = 60;
const MAX_POLISH_PENDING = 8;
const PARTIAL_MS = 300;
const WINDOW_SECONDS = 3;
const WEIGHTS = [0.55, 0.9, 1, 0.75, 0.95, 0.6, 0.8];

const stateEl = document.getElementById("state");
const lineEl = document.getElementById("line");
const hintEl = document.getElementById("hint");
const tidyEl = document.getElementById("tidy");
const tidyHint = document.getElementById("tidy-hint");
const whisperEl = document.getElementById("whisper");
const whisperHint = document.getElementById("whisper-hint");
const recordEl = document.getElementById("record");
const bars = [...document.querySelectorAll(".wave i")];
const pauseEl = document.getElementById("pause");
const copyRecoveryEl = document.getElementById("copy-recovery");
const recoveryTextEl = document.getElementById("recovery-text");
const clearRecoveryEl = document.getElementById("clear-recovery");
const version = document.querySelector('meta[name="parlo-version"]').content;

let stream = null;
let context = null;
let source = null;
let processor = null;
let sink = null;
let chunks = [];
let ticker = null;
let paused = false;
let busy = false;
let lastText = "";
let streamFinal = "";
let finalStale = false;
let transcriptComplete = true;
let promoted = false;
let writeTarget = "";
let writeSource = "";
let writePairs = [];
let writeNames = {};
let writeChoice = localStorage.getItem("parlo-write");
let coverage = new Set();
let coverageReady = false;
if (writeChoice === "same") {
  writeChoice = "";
  localStorage.setItem("parlo-write", "");
}
let controller = null;
let sentChunks = 0;
let quietGain = 1;
let quietPeak = 0;
let quietBlocks = 0;
let partials = null;
let tidy = localStorage.getItem("parlo-tidy") === "on";
let whisper = localStorage.getItem("parlo-whisper") === "on";
let liveBase = "";
let liveConfirmed = "";
let liveGuess = "";
let partialTicket = 0;
let partialRunning = false;
let starting = false;
let session = 0;
let armed = false;
let autoListening = false;
let warmed = false;
let commandMode = false;
let commandSelection = "";
let recoveryText = "";
let recoveryPartial = false;
let recoveryCopied = false;
let recoveryReady = false;
let recoveryQueue = Promise.resolve();
let lastReported = "";
let reportQueue = Promise.resolve();
let silenceDetector = null;
let segmentStart = 0;
let segmentQueue = Promise.resolve();
let segmentFailure = null;
let segmentsWritten = 0;
let segmentText = "";
let segmentPending = 0;
let segmentUnsent = 0;
let segmentController = null;
let segmentWarning = "";
let audioBlocks = 0;
let segmentSamples = 0;

function tauriWindow() {
  const api = window.__TAURI__;
  if (!api || !api.window || !api.window.getCurrentWindow) {
    return null;
  }
  return api.window.getCurrentWindow();
}

let hideTimer = null;

function keepIsland() {
  clearTimeout(hideTimer);
  hideTimer = null;
}

function hideIsland() {
  const win = tauriWindow();
  if (win && win.hide) {
    win.hide().catch(() => {});
  }
}

function hideAfterDelay(milliseconds) {
  keepIsland();
  openWriteMenu(false);
  hideTimer = setTimeout(hideIsland, milliseconds);
}

async function setIslandHeight(open) {
  const win = tauriWindow();
  const api = window.__TAURI__;
  if (!win || !api.dpi) {
    return;
  }
  const scale = await win.scaleFactor();
  const size = await win.outerSize();
  const position = await win.outerPosition();
  let next = open ? Math.max(size.height, Math.round(ISLAND_OPEN_HEIGHT * scale)) : Math.round(ISLAND_HEIGHT * scale);
  const down = document.body.classList.contains("menu-down");
  let top = down ? position.y : position.y + size.height - next;
  if (open) {
    const monitor = await api.window.monitorFromPoint(position.x + size.width / 2, position.y + size.height / 2);
    if (monitor) {
      const area = monitor.workArea || { position: monitor.position, size: monitor.size };
      const availableTop = position.y - area.position.y;
      const availableBottom = area.position.y + area.size.height - position.y - size.height;
      const growDown = availableTop < next - size.height && availableBottom > availableTop;
      const available = growDown ? availableBottom : availableTop;
      next = Math.min(next, size.height + Math.max(0, available));
      top = growDown ? position.y : position.y + size.height - next;
      document.body.classList.toggle("menu-down", growDown);
    }
  }
  if (open) {
    await win.setPosition(new api.dpi.PhysicalPosition(position.x, top));
    await win.setSize(new api.dpi.PhysicalSize(size.width, next));
  } else {
    await win.setSize(new api.dpi.PhysicalSize(size.width, next));
    await win.setPosition(new api.dpi.PhysicalPosition(position.x, top));
  }
  if (!open) {
    document.body.classList.remove("menu-down");
  }
}

function startDragging(event) {
  if (event.button !== 0) {
    return;
  }
  if (event.target.closest("button, a, input, select, .recovery-text, [role=\"listbox\"], [role=\"switch\"]")) {
    return;
  }
  const api = window.__TAURI__ && window.__TAURI__.window;
  if (!api || !api.getCurrentWindow) {
    return;
  }
  try {
    api.getCurrentWindow().startDragging();
  } catch (failure) {
    return;
  }
}

document.getElementById("island").addEventListener("pointerdown", startDragging);

function paintFirstLoad(hint, warmed) {
  if (!hint) {
    return;
  }
  hint.hidden = Boolean(warmed);
}

let islandResize = Promise.resolve();

function resizeIsland(open) {
  islandResize = islandResize.catch(() => {}).then(() => setIslandHeight(open));
  return islandResize;
}

function showRecovery(text, partial) {
  recoveryText = text.trim();
  recoveryPartial = Boolean(partial);
  recoveryCopied = false;
  recoveryTextEl.textContent = recoveryText;
  recoveryTextEl.hidden = !recoveryText;
  recoveryTextEl.tabIndex = recoveryText ? 0 : -1;
  copyRecoveryEl.hidden = !recoveryText;
  clearRecoveryEl.hidden = !recoveryText;
  clearRecoveryEl.dataset.confirm = "no";
  clearRecoveryEl.textContent = "Discard";
  copyRecoveryEl.textContent = recoveryPartial ? "Copy partial text" : "Copy text";
  document.body.classList.toggle("recovery", Boolean(recoveryText));
  resizeIsland(Boolean(recoveryText)).catch(() => {});
  if (recoveryText) {
    saveRecovery(recoveryText, recoveryPartial);
  }
}

function saveRecovery(text, partial) {
  recoveryQueue = recoveryQueue.then(async () => {
    try {
      const response = await fetch("/recovery", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: JSON.stringify({ text, partial }),
      });
      if (!response.ok) throw new Error("The result could not be saved on this computer.");
      return true;
    } catch (failure) {
      setState("Save failed", "Copy the text before closing Parlo. It could not be saved for recovery.", true);
      return false;
    }
  });
  return recoveryQueue;
}

async function loadRecovery() {
  try {
    const response = await fetch("/recovery", { headers: { Authorization: "Bearer " + token }, cache: "no-store" });
    if (!response.ok) throw new Error("The saved result could not be read.");
    const saved = await response.json();
    if (saved.text) {
      recoveryText = saved.text;
      recoveryPartial = Boolean(saved.partial);
      recoveryCopied = false;
      recoveryTextEl.textContent = recoveryText;
      recoveryTextEl.hidden = false;
      recoveryTextEl.tabIndex = 0;
      copyRecoveryEl.hidden = false;
      clearRecoveryEl.hidden = false;
      copyRecoveryEl.textContent = recoveryPartial ? "Copy partial text" : "Copy text";
      document.body.classList.remove("ready");
      document.body.classList.add("recovery");
      resizeIsland(true).catch(() => {});
      setState("Recovered text", "Saved on this computer. Review, copy or discard it.", true);
      report("ready-to-copy");
    }
    recoveryReady = true;
  } catch (failure) {
    document.body.classList.remove("ready");
    setState("Recovery unavailable", "Restart Parlo to try loading your saved dictation.", true);
    report("error");
  }
}

async function clearRecovery() {
  if (!recoveryText || copyRecoveryEl.disabled || clearRecoveryEl.disabled || starting) return;
  if (clearRecoveryEl.dataset.confirm !== "yes") {
    clearRecoveryEl.dataset.confirm = "yes";
    clearRecoveryEl.textContent = "Confirm discard";
    setState("Discard dictation?", "Press Confirm discard to remove the saved text, or copy it instead.", true);
    return;
  }
  clearRecoveryEl.disabled = true;
  copyRecoveryEl.disabled = true;
  if (await saveRecovery("", false)) {
    showRecovery("", false);
    ready();
  }
  clearRecoveryEl.disabled = false;
  copyRecoveryEl.disabled = false;
}

function noteWriteFailure(reason) {
  document.body.classList.remove("ready");
  showRecovery(lastText, false);
  setState(
    t("island.failed", "Failed"),
    reason || t("island.dictationFailed", "The dictation failed."),
    true,
  );
  report("error");
}

function setState(text, line, pending) {
  stateEl.textContent = text;
  if (line !== undefined) {
    lineEl.textContent = line;
    lineEl.classList.toggle("pending", Boolean(pending));
  }
}

function report(state) {
  if (lastReported === state) {
    return;
  }
  lastReported = state;
  reportQueue = reportQueue.then(async () => {
    try {
      const response = await fetch("/state", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: JSON.stringify({ state }),
        keepalive: true,
      });
      if (!response.ok && lastReported === state) {
        lastReported = "";
      }
    } catch (failure) {
      if (lastReported === state) {
        lastReported = "";
      }
    }
  });
}

function describeMicrophone(failure) {
  const name = failure && failure.name;
  if (name === "NotAllowedError") {
    return t("island.micBlockedHelp", "The microphone is blocked. Allow it in the Parlo window and try again.");
  }
  if (name === "NotFoundError") {
    return t("island.micMissing", "No microphone was found. Plug one in and try again.");
  }
  return t("island.micFailed", "The microphone did not open. Check that another program is not using it.");
}

function downsample(samples, from, to) {
  if (from === to) {
    return samples;
  }
  const ratio = from / to;
  const length = Math.max(Math.floor(samples.length / ratio), 1);
  const out = new Float32Array(length);
  for (let index = 0; index < length; index += 1) {
    const start = Math.floor(index * ratio);
    const end = Math.min(Math.floor((index + 1) * ratio), samples.length);
    let sum = 0;
    let count = 0;
    for (let cursor = start; cursor < end; cursor += 1) {
      sum += samples[cursor];
      count += 1;
    }
    out[index] = count ? sum / count : 0;
  }
  return out;
}

function encodeWav(samples, rate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const text = (offset, value) => {
    for (let index = 0; index < value.length; index += 1) {
      view.setUint8(offset + index, value.charCodeAt(index));
    }
  };
  text(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  text(8, "WAVE");
  text(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, rate, true);
  view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  text(36, "data");
  view.setUint32(40, samples.length * 2, true);
  for (let index = 0; index < samples.length; index += 1) {
    const value = Math.max(-1, Math.min(1, samples[index]));
    view.setInt16(44 + index * 2, value * 32767, true);
  }
  return new Blob([buffer], { type: "audio/wav" });
}

function measureQuiet(block) {
  if (quietBlocks >= 8) {
    return;
  }
  let peak = 0;
  for (let index = 0; index < block.length; index += 1) {
    const value = Math.abs(block[index]);
    if (value > peak) {
      peak = value;
    }
  }
  quietPeak = Math.max(quietPeak, peak);
  quietBlocks += 1;
  if (quietBlocks === 8 && !whisper) {
    quietGain = quietPeak > 0 && quietPeak < 0.02 ? 4 : 1;
  }
}

function makeSilenceDetector() {
  const levels = [];
  let speechMs = 0;
  let quietMs = 0;
  let speaking = false;
  const observe = (level, milliseconds) => {
    const ordered = [...levels].sort((a, b) => a - b);
    const floor = ordered.length ? ordered[Math.floor((ordered.length - 1) * 0.2)] : 0.008;
    const threshold = Math.max(0.008, Math.min(floor, 0.025) * 2.2);
    if ((!speaking && level <= threshold) || (speaking && level < floor * 1.8)) {
      levels.push(level);
      if (levels.length > 80) {
        levels.shift();
      }
    }
    if (level > threshold) {
      speechMs += milliseconds;
      quietMs = 0;
      if (speechMs >= 160) {
        speaking = true;
      }
    } else {
      speechMs = 0;
      quietMs += milliseconds;
    }
    if (speaking && quietMs >= 800) {
      speaking = false;
      quietMs = 0;
      return true;
    }
    return false;
  };
  return observe;
}

function paintLevel(block) {
  let peak = 0;
  for (let index = 0; index < block.length; index += 1) {
    const value = Math.abs(block[index]);
    if (value > peak) {
      peak = value;
    }
  }
  bars.forEach((bar, index) => {
    const height = Math.min(18, 3 + peak * 90 * WEIGHTS[index]);
    bar.style.transform = `scaleY(${(height / 18).toFixed(3)})`;
  });
}

let attempt = 0;
let opening = null;

function capture() {
  if (stream) {
    return Promise.resolve(true);
  }
  if (opening) {
    return opening;
  }
  opening = openMicrophone();
  return opening.finally(() => {
    opening = null;
  });
}

function silentStream() {
  const runner = new (window.AudioContext || window.webkitAudioContext)();
  const generator = runner.createOscillator();
  const mute = runner.createGain();
  mute.gain.value = 0;
  const tap = runner.createMediaStreamDestination();
  generator.connect(mute);
  mute.connect(tap);
  generator.start();
  window.parloSilence = runner;
  return tap.stream;
}

const selfTest = new URLSearchParams(location.search).has("selftest");

async function openMicrophone() {
  const ticket = ++attempt;
  let opened = null;
  try {
    opened = selfTest
      ? silentStream()
      : await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });
  } catch (failure) {
    if (ticket !== attempt) {
      return false;
    }
    document.body.classList.remove("ready");
    setState(t("island.micBlocked", "Microphone blocked"), describeMicrophone(failure), true);
    showRecovery("", false);
    report("error");
    return false;
  }
  if (ticket !== attempt) {
    opened.getTracks().forEach((track) => track.stop());
    return false;
  }
  try {
    stream = opened;
    context = new (window.AudioContext || window.webkitAudioContext)();
    source = context.createMediaStreamSource(stream);
    processor = context.createScriptProcessor(2048, 1, 1);
    sink = context.createGain();
    sink.gain.value = 0;
    chunks = [];
    sentChunks = 0;
    quietGain = whisper ? 4 : 1;
    quietPeak = 0;
    quietBlocks = 0;
    let voiceFrames = 0;
    const voiceThreshold = 0.015;
    processor.onaudioprocess = (event) => {
      if (paused || busy) {
        return;
      }
      const block = event.inputBuffer.getChannelData(0);
      paintLevel(block);
      const copy = new Float32Array(block.length);
      measureQuiet(block);
      let sum = 0;
      let rawSum = 0;
      for (let index = 0; index < block.length; index += 1) {
        const sample = Math.max(-1, Math.min(1, block[index] * quietGain));
        copy[index] = sample;
        sum += sample * sample;
        rawSum += block[index] * block[index];
      }
      const rms = Math.sqrt(sum / block.length);
      if (armed && !promoted && !starting && !busy) {
        if (rms > voiceThreshold) {
          voiceFrames += 1;
          if (voiceFrames >= 3) {
            autoListening = true;
            begin();
          }
        } else {
          voiceFrames = 0;
        }
      }
      chunks.push(copy);
      audioBlocks += 1;
      segmentSamples += copy.length;
      if (tidy && promoted && silenceDetector && silenceDetector(Math.sqrt(rawSum / block.length), block.length * 1000 / context.sampleRate)) {
        queuePolishSegment(chunks.length);
      }
      if (promoted && (tidy ? segmentSamples : audioBlocks * copy.length) > context.sampleRate * MAX_SECONDS) {
        stop();
      }
    };
    source.connect(processor);
    processor.connect(sink);
    sink.connect(context.destination);
    if (context.state === "suspended") {
      await context.resume();
    }
    if (ticket !== attempt) {
      discard();
      return false;
    }
    paused = false;
    return true;
  } catch (failure) {
    discard();
    document.body.classList.remove("ready");
    setState(t("island.micBlocked", "Microphone blocked"), describeMicrophone(failure), true);
    showRecovery("", false);
    report("error");
    return false;
  }
}

async function begin() {
  if (!recoveryReady) {
    setState("Recovery unavailable", "Wait for saved dictation to load before recording.", true);
    return;
  }
  if (recoveryText && (!recoveryCopied || copyRecoveryEl.disabled)) {
    setState("Copy your text first", "Copy the result before starting another dictation.", true);
    return;
  }
  if (busy || starting) {
    return;
  }
  const ticket = ++session;
  starting = true;
  if (recoveryText) {
    copyRecoveryEl.disabled = true;
    clearRecoveryEl.disabled = true;
  }
  if (recoveryText && !(await saveRecovery("", false))) {
    if (ticket === session) starting = false;
    copyRecoveryEl.disabled = false;
    clearRecoveryEl.disabled = false;
    return;
  }
  copyRecoveryEl.disabled = false;
  clearRecoveryEl.disabled = false;
  if (ticket !== session) {
    if (recoveryText) await saveRecovery(recoveryText, recoveryPartial);
    return;
  }
  armed = false;
  report("armed");
  try {
    keepIsland();
    endStream();
    partialTicket += 1;
    partialRunning = false;
    lastText = "";
    streamFinal = "";
    finalStale = false;
    transcriptComplete = true;
    liveBase = "";
    liveConfirmed = "";
    liveGuess = "";
    silenceDetector = makeSilenceDetector();
    segmentStart = 0;
    audioBlocks = 0;
    segmentSamples = 0;
    segmentQueue = Promise.resolve();
    segmentFailure = null;
    segmentsWritten = 0;
    segmentText = "";
    segmentPending = 0;
    segmentUnsent = 0;
    segmentController = new AbortController();
    segmentWarning = "";
    openWriteMenu(false);
    showRecovery("", false);
    document.body.classList.remove("ready", "recovery");
    setState(t("island.listening", "Listening"), "", true);
    paintFirstLoad(hintEl, warmed);
    if (!stream && !(await capture())) {
      return;
    }
    if (ticket !== session || busy) {
      return;
    }
    if (context && context.state === "suspended") {
      await context.resume().catch(() => {});
    }
    if (ticket !== session || busy) {
      return;
    }
    promoted = true;
    clearInterval(partials);
    if (!tidy) {
      partials = setInterval(sendPartial, PARTIAL_MS);
    }
    paintPause();
    document.body.classList.remove("ready", "paused");
    document.body.classList.add("listening");
    report("listening");
  } finally {
    if (ticket === session) {
      starting = false;
    }
  }
}

function endStream() {
  clearInterval(partials);
  partials = null;
  fetch("/listen/stream-end", {
    method: "POST",
    headers: { Authorization: "Bearer " + token },
    keepalive: true,
  }).catch(() => {});
}

async function sendPartial(force) {
  if (!stream || !context || paused) {
    return;
  }
  if (!force && (busy || partialRunning || !transcriptComplete)) {
    return;
  }
  const batch = chunks.slice(sentChunks);
  if (!batch.length) {
    return;
  }
  sentChunks = chunks.length;
  if (streamFinal) {
    finalStale = true;
  }
  const ticket = partialTicket;
  partialRunning = true;
  try {
    const total = batch.reduce((sum, chunk) => sum + chunk.length, 0);
    const merged = new Float32Array(total);
    let offset = 0;
    for (const chunk of batch) {
      merged.set(chunk, offset);
      offset += chunk.length;
    }
    const response = await fetch("/listen/stream", {
      method: "POST",
      headers: {
        "Content-Type": "audio/wav",
        Authorization: "Bearer " + token,
        "x-parlo-style": localStorage.getItem("parlo.style") || "",
        "x-parlo-window": String(WINDOW_SECONDS),
      },
      body: encodeWav(downsample(merged, context.sampleRate, TARGET_RATE), TARGET_RATE),
    });
    if (ticket !== partialTicket) {
      return;
    }
    if (!response.ok || paused) {
      transcriptComplete = false;
      return;
    }
    const pieces = await response.json();
    const next = readLive(liveBase, liveConfirmed, liveGuess, pieces);
    liveBase = next.base;
    liveConfirmed = next.confirmed;
    liveGuess = next.guess;
    const closed = pieces.some(
      (piece) => piece.state === "final" || piece.state === "corrected"
    );
    if (closed && !next.confirmed && !next.guess) {
      streamFinal = next.text;
      finalStale = false;
    } else if (streamFinal && next.text !== streamFinal) {
      finalStale = true;
    }
    if (next.text && next.text !== lastText) {
      lastText = next.text;
      saveRecovery(lastText, true);
      if (!busy) {
        setState(t("island.listening", "Listening"), lastText, true);
      }
    }
  } catch (failure) {
    if (ticket === partialTicket) {
      transcriptComplete = false;
    }
    return;
  } finally {
    if (ticket === partialTicket) {
      partialRunning = false;
    }
  }
}

function paintPause() {
  pauseEl.textContent = paused ? t("island.resume", "Resume") : t("island.pause", "Pause");
  pauseEl.setAttribute("aria-pressed", String(paused));
  document.body.classList.toggle("paused", paused);
}

function pause() {
  if (!stream || busy || paused) {
    return;
  }
  if (tidy && silenceDetector) {
    queuePolishSegment(chunks.length, true);
    silenceDetector = makeSilenceDetector();
  }
  paused = true;
  if (partialRunning) {
    transcriptComplete = false;
  }
  partialTicket += 1;
  partialRunning = false;
  clearInterval(partials);
  partials = null;
  bars.forEach((bar) => {
    bar.style.transform = "scaleY(0.167)";
  });
  paintPause();
  setState("Paused", lastText || "Recording paused. Resume or stop.", true);
  report("paused");
}

function resume() {
  if (!paused) {
    return;
  }
  paused = false;
  if (stream && !partials && !tidy) {
    partials = setInterval(sendPartial, PARTIAL_MS);
  }
  paintPause();
  setState(t("island.listening", "Listening"), lastText, true);
  report("listening");
}

function togglePause() {
  if (paused) {
    resume();
  } else {
    pause();
  }
}

function teardown() {
  clearInterval(partials);
  partials = null;
  paused = false;
  promoted = false;
  paintPause();
  document.body.classList.remove("listening");
  bars.forEach((bar) => {
    bar.style.transform = "scaleY(0.167)";
  });
  if (processor) {
    processor.onaudioprocess = null;
    processor.disconnect();
  }
  if (source) {
    source.disconnect();
  }
  if (sink) {
    sink.disconnect();
  }
  if (stream) {
    stream.getTracks().forEach((track) => track.stop());
  }
  if (context && context.state !== "closed") {
    context.close();
  }
  const rate = context ? context.sampleRate : 48000;
  stream = null;
  context = null;
  source = null;
  processor = null;
  sink = null;
  const collected = chunks;
  chunks = [];
  return { collected, rate };
}

function discard() {
  attempt += 1;
  session += 1;
  starting = false;
  armed = false;
  partialTicket += 1;
  partialRunning = false;
  clearInterval(ticker);
  ticker = null;
  teardown();
}

function recording(collected, rate) {
  const length = collected.reduce((total, chunk) => total + chunk.length, 0);
  if (!length) {
    return null;
  }
  const merged = new Float32Array(length);
  let offset = 0;
  for (const chunk of collected) {
    merged.set(chunk, offset);
    offset += chunk.length;
  }
  const seconds = length / rate;
  if (seconds < 0.2) {
    return null;
  }
  return { wav: encodeWav(downsample(merged, rate, TARGET_RATE), TARGET_RATE), seconds };
}

function release() {
  clearInterval(ticker);
  ticker = null;
  const { collected, rate } = teardown();
  return recording(collected, rate);
}

async function loadLocale() {
  try {
    const response = await fetch("/locale", { cache: "no-store" });
    if (response.ok) {
      const table = await response.json();
      strings = table.strings || {};
      document.documentElement.lang = table.locale || "en";
      document.documentElement.dir = table.locale === "ar" ? "rtl" : "ltr";
    }
  } catch {
    strings = {};
  }
  applyText();
  paintPause();
  paintTidy();
  paintWrite();
  buildWriteMenu();
}

async function loadSettings() {
  try {
    const response = await fetch("/settings", {
      cache: "no-store",
      headers: { Authorization: "Bearer " + token },
    });
    if (!response.ok) {
      return;
    }
    const values = await response.json();
    writeTarget = (values.write || "").toLowerCase();
    writeSource = (values.from || "").toLowerCase();
  } catch (failure) {
    writeTarget = "";
  }
  paintWrite();
}

async function loadVersion() {
  try {
    const response = await fetch("/update", { cache: "no-store" });
    if (!response.ok) {
      return;
    }
    const update = await response.json();
    if (!update.available || !update.latest) {
      return;
    }
    setState(
      t("island.update", "Update"),
      t("island.updateLine", "v{latest} is available, you are on v{version}.", {
        latest: update.latest,
        version,
      }),
      true,
    );
  } catch (failure) {
    return;
  }
}

function combineWords(left, right) {
  const before = left.trim();
  const after = right.trim();
  return before && after ? before + " " + after : before || after;
}

function wordsOf(text) {
  const value = text.trim();
  return value ? value.split(/\s+/) : [];
}

function readLive(base, confirmed, guess, pieces) {
  let settled = base.trim();
  let stable = wordsOf(confirmed);
  let hypothesis = wordsOf(guess);
  let corrected = "";
  for (const piece of pieces) {
    const text = (piece.text || "").trim();
    if (!text) {
      continue;
    }
    if (piece.state === "partial") {
      hypothesis = wordsOf(text);
      corrected = "";
    } else if (piece.state === "stable") {
      stable = stable.concat(wordsOf(text));
      corrected = "";
    } else if (piece.state === "corrected" || piece.state === "final") {
      if (piece.state !== "final" || text !== corrected) {
        settled = combineWords(settled, text);
      }
      stable = [];
      hypothesis = [];
      corrected = piece.state === "corrected" ? text : "";
    }
  }
  let current = stable;
  if (hypothesis.length && stable.every((word, index) => hypothesis[index] === word)) {
    current = hypothesis;
  }
  const windowText = current.join(" ");
  return {
    base: settled,
    confirmed: stable.join(" "),
    guess: windowText,
    text: combineWords(settled, windowText),
  };
}

async function writeIntoField(text, signal, replace, latency, polish) {
  try {
    const response = await fetch("/insert", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ text: text, replace: replace, latency_ms: latency || 0, polish: !!polish }),
      signal,
    });
    const detail = await response.json().catch(() => ({}));
    if (response.ok && detail.inserted === true) {
      return { written: true, reason: "" };
    }
    return { written: false, reason: detail.error || "The insertion could not be confirmed. Check the field before pasting." };
  } catch (failure) {
    return { written: false, reason: "The insertion could not be confirmed. Check the field before pasting." };
  }
}

async function writeFinal(text, latency) {
  return writeIntoField(text, undefined, "", latency, false);
}

function partialSettled(limitMs) {
  if (!partialRunning) {
    return Promise.resolve(true);
  }
  return new Promise((resolve) => {
    const started = performance.now();
    const check = () => {
      if (!partialRunning) {
        resolve(true);
      } else if (performance.now() - started > limitMs) {
        resolve(false);
      } else {
        setTimeout(check, 15);
      }
    };
    check();
  });
}

async function cancel() {
  const hadSomething = Boolean(stream) || busy || starting;
  const recovered = hadSomething ? (segmentText || lastText) : recoveryText;
  const finalRequest = Boolean(controller) || segmentPending > 0 || segmentsWritten > 0;
  busy = true;
  session += 1;
  commandMode = false;
  commandSelection = "";
  if (processor) {
    processor.onaudioprocess = null;
  }
  if (stream) {
    stream.getTracks().forEach((track) => track.stop());
  }
  if (segmentController) {
    segmentController.abort();
    segmentController = null;
  }
  if (controller) {
    controller.abort();
    controller = null;
  }
  liveBase = "";
  liveConfirmed = "";
  liveGuess = "";
  attempt += 1;
  discard();
  busy = false;
  document.body.classList.remove("listening");
  if (hadSomething) {
    document.body.classList.remove("ready");
    if (recovered) {
      showRecovery(recovered, true);
      setState(t("island.cancelled", "Cancelled"), "Recognized text is available to copy. Later audio may not have been transcribed.", true);
    } else {
      setState(t("island.cancelled", "Cancelled"), finalRequest ? "Cancellation requested. Check your field for any text already written." : t("island.nothingInserted", "Nothing was inserted."), true);
    }
  } else {
    ready();
  }
  report(recovered ? "error" : "cancelled");
  const cancelledSession = session;
  if (hadSomething && recovered && !(await recoveryQueue) && cancelledSession === session) {
    setState("Save failed", "Copy the text before closing Parlo. It could not be saved for recovery.", true);
  }
}

async function dismissIsland() {
  keepIsland();
  openWriteMenu(false);
  await cancel();
  hideIsland();
}

function queuePolishSegment(end, trailing = false) {
  if (!context || segmentFailure) {
    return;
  }
  if (segmentPending >= MAX_POLISH_PENDING && !busy) {
    stop();
    return;
  }
  const collected = chunks.slice(segmentStart, end);
  if (!collected.length) {
    return;
  }
  const captured = recording(collected, context.sampleRate);
  if (!captured) {
    return;
  }
  chunks.splice(segmentStart, end - segmentStart);
  segmentSamples -= collected.reduce((sum, chunk) => sum + chunk.length, 0);
  const ticket = session;
  const signal = segmentController.signal;
  const write = effectiveWrite();
  const headers = {
    "Content-Type": "audio/wav",
    Authorization: "Bearer " + token,
    "x-parlo-clean": "on",
  };
  if ((!write || write === "same") && writeSource) {
    headers["x-parlo-write"] = writeSource;
  } else if (write && write !== "same") {
    headers["x-parlo-write"] = write;
  }
  segmentPending += 1;
  segmentQueue = segmentQueue.then(async () => {
    let text = "";
    try {
      if (segmentFailure || ticket !== session) {
        if (ticket === session) {
          segmentUnsent += 1;
        }
        return;
      }
      const response = await fetch("/dictate", { method: "POST", headers, body: captured.wav, signal });
      if (!response.ok) {
        const detail = await response.json().catch(() => ({}));
        throw new Error(detail.error || "Could not transcribe the recording.");
      }
      const result = await response.json();
      if (ticket !== session) {
        return;
      }
      text = (result.translation || result.text || "").trim();
      if (!text) {
        if (trailing) {
          return;
        }
        throw new Error("No words were recognized. Try speaking closer to the microphone.");
      }
      segmentText = segmentText ? segmentText + " " + text : text;
      saveRecovery(segmentText, true);
      segmentsWritten += 1;
      lastText = segmentText;
      warmed = true;
      paintFirstLoad(hintEl, true);
      if (result.note) {
        segmentWarning = result.note;
        setState(t("island.listening", "Listening"), result.note, true);
      } else if (!busy) {
        setState(t("island.listening", "Listening"), text, false);
      }
    } catch (failure) {
      if (ticket === session) {
        segmentFailure = { message: failure.message || "Could not process the recording.", text };
        if (!busy) {
          stop();
        }
      }
    } finally {
      if (ticket === session) {
        segmentPending -= 1;
      }
    }
  });
}

async function commandModeStart() {
  if (busy || starting || !recoveryReady) {
    return;
  }
  let answer;
  try {
    answer = await fetch("/command/copy", {
      method: "POST",
      headers: { Authorization: "Bearer " + token },
    });
  } catch {
    setState("Command failed", "Parlo did not answer.", true);
    return;
  }
  if (!answer.ok) {
    const detail = await answer.json().catch(() => ({}));
    setState("Nothing to change", detail.error || "Select some text first, then press the command shortcut again.", true);
    return;
  }
  const body = await answer.json().catch(() => null);
  const text = ((body && body.text) || "").trim();
  if (!text) {
    setState("Nothing to change", "Select some text first, then press the command shortcut again.", true);
    return;
  }
  commandSelection = text;
  commandMode = true;
  await begin();
  if (!promoted) {
    commandMode = false;
    commandSelection = "";
    return;
  }
  setState("Say a command", "Say make it formal, make it casual, make it excited, uppercase, lowercase, title case, make it shorter, or bullets.", true);
}

function commandName(spoken) {
  const said = spoken.toLowerCase().replace(/[^a-z ]+/g, " ");
  if (/\bformal\b/.test(said)) return "formal";
  if (/\bcasual\b/.test(said)) return "casual";
  if (/\bexcited\b/.test(said)) return "excited";
  if (/\bupper/.test(said)) return "uppercase";
  if (/\blower/.test(said)) return "lowercase";
  if (/\btitle\b/.test(said)) return "title";
  if (/\bshort/.test(said)) return "shorter";
  if (/\bbullet/.test(said)) return "bullets";
  return "";
}

async function stopCommand() {
  busy = true;
  const ticket = session;
  if (processor) {
    processor.onaudioprocess = null;
  }
  if (segmentController) {
    segmentController.abort();
  }
  stream.getTracks().forEach((track) => track.stop());
  document.body.classList.remove("listening", "paused");
  setState("Processing", "Changing the selection.", true);
  report("processing");
  clearInterval(partials);
  partials = null;
  const captured = release();
  partialTicket += 1;
  partialRunning = false;
  if (!captured) {
    busy = false;
    commandSelection = "";
    ready();
    return;
  }
  try {
    const heard = await fetch("/dictate", {
      method: "POST",
      headers: { "Content-Type": "audio/wav", Authorization: "Bearer " + token, "x-parlo-clean": "off" },
      body: captured.wav,
    });
    if (!heard.ok) {
      const detail = await heard.json().catch(() => ({}));
      throw new Error(detail.error || "The command was not heard.");
    }
    const said = await heard.json();
    if (ticket !== session) {
      return;
    }
    const wanted = commandName((said.text || "").trim());
    if (!wanted) {
      setState("Unknown command", "Say make it formal, make it casual, make it excited, uppercase, lowercase, title case, make it shorter, or bullets.", true);
      report("error");
      return;
    }
    const changed = await fetch("/command", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ text: commandSelection, command: wanted }),
    });
    if (!changed.ok) {
      const detail = await changed.json().catch(() => ({}));
      throw new Error(detail.error || "The selection could not be changed.");
    }
    const out = await changed.json();
    if (ticket !== session) {
      return;
    }
    const finalText = (out.text || "").trim();
    lastText = finalText;
    showRecovery(finalText, false);
    setState("Ready to copy", "The changed text is ready. Copy it and paste it over the selection.", false);
    report("ready-to-copy");
  } catch (failure) {
    if (ticket === session) {
      setState("Command failed", failure.message || "The command failed.", true);
      report("error");
    }
  } finally {
    if (ticket === session) {
      busy = false;
    }
    commandSelection = "";
  }
}

async function stop() {
  if (busy) {
    return;
  }
  if (!promoted) {
    if (starting || armed) {
      discard();
      ready();
    }
    return;
  }
  if (!stream) {
    return;
  }
  if (commandMode) {
    commandMode = false;
    await stopCommand();
    return;
  }
  busy = true;
  const ticket = session;
  let failed = false;
  let recoveryShown = false;
  if (processor) {
    processor.onaudioprocess = null;
  }
  stream.getTracks().forEach((track) => track.stop());
  if (tidy) {
    queuePolishSegment(chunks.length, true);
  }
  document.body.classList.remove("listening", "paused");
  setState("Processing", "Preparing your dictation.", true);
  report("processing");
  clearInterval(partials);
  partials = null;
  if (tidy) {
    const hasUnsentTail = chunks.length > segmentStart;
    clearInterval(ticker);
    ticker = null;
    teardown();
    await segmentQueue;
    if (ticket !== session) {
      return;
    }
    lastText = segmentText;
    const polished = segmentFailure || !segmentsWritten ? { written: false, reason: "" } : await writeFinal(segmentText, 0);
    if (ticket !== session) {
      return;
    }
    segmentController = null;
    busy = false;
    if (segmentFailure) {
      lastText = segmentText;
      const omitted = segmentUnsent || hasUnsentTail;
      const warning = "Later audio was not transcribed.";
      showRecovery(lastText, true);
      setState(t("island.failed", "Failed"), segmentFailure.message + (omitted && !segmentFailure.message.includes(warning) ? " " + warning : ""), true);
      report("error");
    } else if (!segmentsWritten) {
      setState(t("island.nothingHeard", "Nothing heard"), t("island.speakCloser", "Speak a little closer to the microphone."), true);
      showRecovery("", false);
      report("error");
    } else {
      showRecovery(segmentText, false);
      if (polished.written) {
        setState("Written", segmentWarning || "The cleaned sentence is in your field. Undo removes it.", false);
      } else {
        setState("Ready to copy", polished.reason || segmentWarning || "Review and copy the text, then paste it into your field.", false);
      }
      report("ready-to-copy");
    }
    if (lastText && !(await recoveryQueue) && ticket === session) {
      setState("Save failed", "Copy the text before closing Parlo. It could not be saved for recovery.", true);
    }
    return;
  }
  if (ticket !== session) {
    return;
  }
  const settledInTime = await partialSettled(2500);
  if (ticket !== session) {
    return;
  }
  if (!settledInTime || paused || sentChunks !== chunks.length) {
    transcriptComplete = false;
  }
  const transcriptReady = transcriptComplete;
  const settled = transcriptReady && streamFinal && !finalStale ? streamFinal : "";
  const captured = release();
  partialTicket += 1;
  partialRunning = false;
  if (!captured) {
    busy = false;
    if (lastText) {
      showRecovery(lastText, true);
      setState("Ready to copy", "Only the partial text is available to copy.", true);
      report("error");
    } else {
      report("cancelled");
      ready();
    }
    return;
  }
  setState("Processing", tidy ? t("island.polishing", "Polishing the sentence.") : "Transcribing your recording.", true);
  controller = new AbortController();
  const { signal } = controller;
  try {
    const headers = {
      "Content-Type": "audio/wav",
      Authorization: "Bearer " + token,
      "x-parlo-clean": tidy ? "on" : "off",
    };
    const write = effectiveWrite();
    if (!write || write === "same") {
      if (writeSource) {
        headers["x-parlo-write"] = writeSource;
      }
    } else if (write) {
      headers["x-parlo-write"] = write;
    }
    const plain = !write || write === "same" || write === writeSource;
    const fastText = settled;
    let result = null;
    if (plain && fastText) {
      const wanted = tidy;
      const asked = fetch("/dictate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
          "x-parlo-clean": wanted ? "on" : "off",
          ...(writeSource ? { "x-parlo-write": writeSource } : {}),
        },
        body: JSON.stringify({ text: fastText, seconds: captured.seconds }),
        signal,
      })
        .then((answer) => (answer.ok ? answer.json().catch(() => null) : null))
        .catch(() => null);
      result = await asked;
    }
    if (!result) {
      const response = await fetch("/dictate", {
        method: "POST",
        headers,
        body: captured.wav,
        signal,
      });
      if (!response.ok) {
        const detail = await response.json().catch(() => ({}));
        throw new Error(detail.error || "Parlo answered with status " + response.status + ".");
      }
      result = await response.json();
    }
    if (ticket !== session) {
      return;
    }
    warmed = true;
    paintFirstLoad(hintEl, true);
    const spoken = (result.text || "").trim();
    const text = (result.translation || "").trim() || spoken;
    if (!text) {
      setState(t("island.nothingHeard", "Nothing heard"), t("island.speakCloser", "Speak a little closer to the microphone."), true);
      document.body.classList.remove("ready");
      showRecovery(lastText, true);
      controller = null;
      busy = false;
      report("error");
      return;
    }
    lastText = text;
    showRecovery(text, false);
    recoveryShown = true;
    const written = await writeFinal(text, result.latency_ms);
    if (ticket !== session) {
      return;
    }
    if (written.written) {
      setState("Written", result.note || "The sentence is in your field. Undo removes it.", false);
    } else {
      setState("Ready to copy", written.reason || result.note || "Review and copy the text, then paste it into your field.", false);
    }
  } catch (failure) {
    if (ticket !== session) {
      return;
    }
    document.body.classList.remove("ready");
    if (signal.aborted) {
      setState(t("island.cancelled", "Cancelled"), "Cancellation requested. Check your field for any text already written.", true);
    } else {
      setState(t("island.failed", "Failed"), failure.message || t("island.dictationFailed", "The dictation failed."), true);
      showRecovery(lastText, true);
    }
    failed = true;
  }
  controller = null;
  busy = false;
  report(failed ? (signal.aborted ? "cancelled" : "error") : "ready-to-copy");
  if (recoveryShown && !(await recoveryQueue) && ticket === session) {
    setState("Save failed", "Copy the text before closing Parlo. It could not be saved for recovery.", true);
  }
}

function tap() {
  return cancel();
}

function handsFree() {
  if (starting) {
    if (busy) {
      return;
    }
    discard();
    ready();
    return;
  }
  if (promoted && stream) {
    stop();
    return;
  }
  begin();
}

function beginFromHold() {
  if (!armed) {
    return;
  }
  armed = false;
  begin();
}

function arm() {
  if (!recoveryReady) {
    setState("Recovery unavailable", "Wait for saved dictation to load before recording.", true);
    return;
  }
  if (recoveryText && (!recoveryCopied || copyRecoveryEl.disabled)) {
    setState("Copy your text first", "Copy the result before starting another dictation.", true);
    return;
  }
  if (busy || starting || (promoted && stream)) {
    return;
  }
  armed = true;
  keepIsland();
  openWriteMenu(false);
  document.body.classList.add("ready");
  document.body.classList.remove("listening");
  report("armed");
  capture();
}

function ready() {
  if (!recoveryReady) {
    return;
  }
  if (recoveryText && (!recoveryCopied || copyRecoveryEl.disabled)) {
    document.body.classList.remove("ready", "listening");
    document.body.classList.add("recovery");
    setState("Copy your text first", "Copy the result before starting another dictation.", true);
    return;
  }
  if (busy || (promoted && stream)) {
    return;
  }
  discard();
  document.body.classList.add("ready");
  document.body.classList.remove("listening", "recovery");
  setState("", "", true);
  report("armed");
}

function paintTidy() {
  tidyEl.setAttribute("aria-checked", String(tidy));
  tidyHint.textContent = tidy
    ? t("island.drops", "Drops filler and repeats")
    : t("island.keeps", "Keeps every spoken word");
}

function paintWhisper() {
  whisperEl.setAttribute("aria-checked", String(whisper));
  whisperHint.textContent = whisper
    ? "Microphone gain is raised for quiet speech"
    : "Raises the microphone gain for quiet speech";
}

const writeEl = document.getElementById("write");
const writeMenu = document.getElementById("write-menu");
const writeName = document.getElementById("write-name");

function writableTargets() {
  return writeTargets(writePairs, writeNames, writeSource);
}

function languageName(code) {
  return t("language." + code, writeNames[code] || code.toUpperCase());
}

function writeOptions() {
  return [{ code: "same", name: t("island.spokenLanguage", "Spoken language") }].concat(
    writableTargets().map((code) => ({ code, name: languageName(code) })),
  );
}

function effectiveWrite() {
  const chosen = writeChoice === null ? writeTarget : writeChoice;
  if (chosen === "same") {
    return "same";
  }
  return writeOptions().some((option) => option.code === chosen) ? chosen : "";
}

function paintWrite() {
  const active = effectiveWrite();
  const shown = writeOptions().find((option) => option.code === active);
  writeName.textContent = shown ? shown.name : t("island.spokenLanguage", "Spoken language");
  for (const item of writeMenu.children) {
    item.setAttribute("aria-selected", String(item.dataset.code === active));
  }
}

let menuResize = Promise.resolve();

function openWriteMenu(open) {
  if (writeMenu.hidden === !open) {
    return menuResize;
  }
  writeMenu.hidden = !open;
  writeEl.setAttribute("aria-expanded", String(open));
  if (open) {
    keepIsland();
  }
  menuResize = menuResize.then(async () => {
    await resizeIsland(open);
    if (open && !writeMenu.hidden) {
      const active = writeMenu.querySelector('[aria-selected="true"]') || writeMenu.firstElementChild;
      if (active) {
        active.focus();
      }
    }
  }).catch(() => {
    writeMenu.hidden = true;
    writeEl.setAttribute("aria-expanded", "false");
  });
  return menuResize;
}

function chooseWrite(code) {
  writeChoice = code;
  localStorage.setItem("parlo-write", writeChoice);
  openWriteMenu(false);
  paintWrite();
  writeEl.focus();
}

function buildWriteMenu() {
  writeMenu.replaceChildren();
  for (const option of writeOptions()) {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "write-option";
    item.dataset.code = option.code;
    item.setAttribute("role", "option");
    item.textContent = option.name;
    if (option.code && option.code !== "same" && !covered(option.code)) {
      item.classList.add("needs-download");
      item.title = t("island.needsModel", "Parlo needs the model for this language; open Parlo to download it");
      item.addEventListener("click", openModels);
    } else {
      item.addEventListener("click", () => chooseWrite(option.code));
    }
    writeMenu.append(item);
  }
  paintWrite();
}

function pairKey(from, to) {
  return from + ">" + to;
}

function covered(code) {
  return !coverageReady || coverage.has(pairKey(writeSource, code));
}

function openModels() {
  window.open(location.origin + "/?t=" + encodeURIComponent(token) + "#library/models", "_blank");
}

async function loadCoverage() {
  try {
    const response = await fetch("/models", { cache: "no-store" });
    if (!response.ok) {
      return;
    }
    const state = await response.json();
    const models = Array.isArray(state.models) ? state.models : [];
    coverage = new Set();
    for (const model of models) {
      const pair = Array.isArray(model.languages) ? model.languages : [];
      if (model.installed && model.kind === "translation" && pair.length >= 2) {
        coverage.add(pairKey(pair[0], pair[1]));
      }
    }
    coverageReady = true;
  } catch (failure) {
    return;
  }
  buildWriteMenu();
}

async function loadLanguages() {
  try {
    const response = await fetch("/languages.json", { cache: "no-store" });
    if (!response.ok) {
      return;
    }
    const table = await response.json();
    writePairs = Array.isArray(table.pairs) ? table.pairs : [];
    writeNames = table.names || {};
  } catch (failure) {
    writePairs = [];
  }
  buildWriteMenu();
}

function warmEngine() {
  fetch("/warm", { method: "POST", headers: { Authorization: "Bearer " + token } }).catch(() => {});
}

warmEngine();

writeEl.addEventListener("click", () => openWriteMenu(writeMenu.hidden));
writeEl.addEventListener("keydown", (event) => {
  if (event.key === "ArrowDown" || event.key === "ArrowUp" || event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    openWriteMenu(true);
  }
});
writeMenu.addEventListener("keydown", (event) => {
  const items = [...writeMenu.children];
  const at = items.indexOf(document.activeElement);
  if (event.key === "Escape") {
    event.preventDefault();
    event.stopPropagation();
    openWriteMenu(false);
    writeEl.focus();
    return;
  }
  if (event.key === "ArrowDown") {
    event.preventDefault();
    items[Math.min(at + 1, items.length - 1)].focus();
  }
  if (event.key === "ArrowUp") {
    event.preventDefault();
    items[Math.max(at - 1, 0)].focus();
  }
});
writeMenu.addEventListener("focusout", (event) => {
  if (!writeMenu.contains(event.relatedTarget) && event.relatedTarget !== writeEl) {
    openWriteMenu(false);
  }
});

tidyEl.addEventListener("click", () => {
  tidy = !tidy;
  localStorage.setItem("parlo-tidy", tidy ? "on" : "off");
  paintTidy();
});

whisperEl.addEventListener("click", () => {
  whisper = !whisper;
  localStorage.setItem("parlo-whisper", whisper ? "on" : "off");
  paintWhisper();
});

async function copyRecovery() {
  if (!recoveryText) {
    setState("Nothing to copy", "There is no dictation text to copy yet.", true);
    return;
  }
  if (copyRecoveryEl.disabled || starting) {
    return;
  }
  copyRecoveryEl.disabled = true;
  clearRecoveryEl.disabled = true;
  clearRecoveryEl.dataset.confirm = "no";
  clearRecoveryEl.textContent = "Discard";
  recoveryCopied = false;
  try {
    const response = await fetch("/clipboard", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ text: recoveryText, keep: true }),
    });
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}));
      throw new Error(detail.error || "The clipboard did not accept the text.");
    }
    const detail = await response.json();
    if (detail.copied !== true) {
      throw new Error("The clipboard did not confirm the copy.");
    }
    recoveryCopied = true;
    setState(t("island.copied", "Copied"), recoveryPartial ? "Partial text copied. Check it before using it." : "Text copied. Paste it into your field.", true);
  } catch (failure) {
    setState(t("island.failed", "Failed"), failure.message || "Could not copy the text.", true);
  } finally {
    copyRecoveryEl.disabled = false;
    clearRecoveryEl.disabled = false;
  }
}

copyRecoveryEl.addEventListener("click", copyRecovery);
clearRecoveryEl.addEventListener("click", clearRecovery);

recordEl.addEventListener("click", () => {
  begin();
});

document.getElementById("stop").addEventListener("click", () => {
  stop();
});

document.getElementById("dismiss").addEventListener("click", dismissIsland);

paintTidy();
paintWhisper();
paintWrite();

window.parloArm = arm;
window.parloReady = ready;
window.parloBegin = beginFromHold;
window.parloCommand = commandModeStart;
window.parloStop = stop;
window.parloCancel = cancel;
window.parloTap = tap;
window.parloHandsFree = handsFree;
window.parloEscape = escapeIsland;
window.parloResizeRecovery = () => { if (recoveryText) resizeIsland(true).catch(() => {}); };
window.parloCopyRecovery = copyRecovery;
window.parloReviewRecovery = () => {
  if (recoveryText) recoveryTextEl.focus();
};

pauseEl.addEventListener("click", togglePause);

function escapeIsland() {
  if (!writeMenu.hidden) {
    openWriteMenu(false);
    writeEl.focus();
    return;
  }
  dismissIsland();
}

window.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    event.preventDefault();
    escapeIsland();
  }
  if (event.key === "Enter" && event.ctrlKey && recoveryText) {
    event.preventDefault();
    copyRecovery();
  }
  if (event.key === " " && stream && !(event.target instanceof HTMLButtonElement)) {
    event.preventDefault();
    togglePause();
  }
});

loadRecovery();
loadLocale();
loadVersion();
Promise.all([loadSettings(), loadLanguages()]).then(loadCoverage);

try {
  const channel = new BroadcastChannel("parlo-locale");
  channel.onmessage = () => {
    loadLocale();
    loadSettings().then(paintWrite).then(paintTidy);
    loadLanguages().then(buildWriteMenu);
  };
} catch {}
</script>
</body>
</html>
