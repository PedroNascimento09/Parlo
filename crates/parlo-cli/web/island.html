<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="parlo-version" content="__PARLO_VERSION__">
<meta name="color-scheme" content="light dark">
<title>Parlo Dictate</title>
<style>
  :root {
    --shell: rgba(13, 18, 14, 0.94);
    --ink: #f0f3ea;
    --muted: #8d968a;
    --line: rgba(240, 243, 234, 0.12);
    --accent: #c9f26b;
    --accent-ink: #0a0e0b;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --shell: rgba(255, 255, 255, 0.95);
      --ink: #0e120f;
      --muted: #5e665c;
      --line: rgba(14, 18, 15, 0.12);
      --accent: #3d5a12;
      --accent-ink: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; }
  body {
    display: grid;
    align-items: center;
    padding: 8px;
    font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .island {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--shell);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    backdrop-filter: blur(18px) saturate(140%);
    animation: settle 160ms cubic-bezier(0.2, 0.9, 0.3, 1) both;
  }
  .wave {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 16px;
    width: 18px;
  }
  .wave i {
    display: block;
    width: 2px;
    height: 4px;
    border-radius: 2px;
    background: var(--muted);
    transition: height 120ms ease, background 160ms ease;
  }
  .wave i:nth-child(2) { height: 8px; }
  .wave i:nth-child(3) { height: 6px; }
  body.listening .wave i {
    background: var(--accent);
    animation: speak 900ms ease-in-out infinite;
  }
  body.listening .wave i:nth-child(2) { animation-delay: 90ms; }
  body.listening .wave i:nth-child(3) { animation-delay: 180ms; }
  body.listening .wave i:nth-child(4) { animation-delay: 270ms; }
  .readout { min-width: 0; display: grid; gap: 1px; }
  .state {
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  body.listening .state { color: var(--accent); }
  .line {
    font-size: 13.5px;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .line.pending { color: var(--muted); }
  .clock {
    font-family: "Cascadia Mono", ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .actions { display: none; align-items: center; gap: 8px; }
  body.ready .actions { display: flex; }
  body.ready .clock { display: none; }
  .actions button {
    font: inherit;
    font-size: 12px;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .actions button:hover { color: var(--ink); border-color: var(--muted); }
  .actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .actions .switch[aria-pressed="true"] {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
  }
  .actions .record { color: var(--ink); border-color: var(--ink); }
  .hint {
    margin: 2px 0 0;
    font-size: 11.5px;
    line-height: 1.35;
    color: var(--muted);
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 160ms ease, max-height 160ms ease;
  }
  body.showing-hint .hint { opacity: 1; max-height: 3.4rem; }
  body.listening .hint { opacity: 0; max-height: 0; }
  @keyframes settle {
    from { opacity: 0; transform: translateY(6px) scale(0.99); }
    to { opacity: 1; transform: none; }
  }
  @keyframes speak {
    0%, 100% { height: 4px; }
    50% { height: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .island { animation: none; }
    body.listening .wave i { animation: none; height: 10px; }
  }
</style>
</head>
<body>
  <div class="island">
    <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <div class="readout">
      <span class="state" id="state">Ready</span>
      <span class="line pending" id="line">Press the shortcut and speak.</span>
      <p class="hint" id="hint">Text goes to the clipboard when you stop.</p>
    </div>
    <span class="clock" id="clock">0.0 s</span>
    <div class="actions" id="actions">
      <button type="button" class="switch" id="translate" aria-pressed="true">Translate</button>
      <button type="button" class="record" id="record">Record</button>
    </div>
  </div>
<script>
const token = new URLSearchParams(location.search).get("t") || "";
const TARGET_RATE = 16000;
const MAX_SECONDS = 60;

const stateEl = document.getElementById("state");
const lineEl = document.getElementById("line");
const clockEl = document.getElementById("clock");
const hintEl = document.getElementById("hint");
const version = document.querySelector('meta[name="parlo-version"]').content;

let stream = null;
let context = null;
let source = null;
let processor = null;
let sink = null;
let chunks = [];
let started = 0;
let ticker = null;
let busy = false;
let lastText = "";
let target = false;
let writeTarget = "";
let shortcut = "Ctrl+Alt+D";
let sourceLanguage = "";
let translate = localStorage.getItem("parlo-translate") !== "off";
let controller = null;
let sentChunks = 0;
let partials = null;

function setState(text, line, pending) {
  stateEl.textContent = text;
  if (line !== undefined) {
    lineEl.textContent = line;
    lineEl.classList.toggle("pending", Boolean(pending));
  }
}

function setHint(text) {
  hintEl.textContent = text;
  document.body.classList.add("showing-hint");
}

function report(state) {
  fetch("/state", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: JSON.stringify({ state }),
    keepalive: true,
  }).catch(() => {});
}

function describeMicrophone(failure) {
  const name = failure && failure.name;
  if (name === "NotAllowedError") {
    return "The microphone is blocked. Allow it in the Parlo window and try again.";
  }
  if (name === "NotFoundError") {
    return "No microphone was found. Plug one in and try again.";
  }
  return "The microphone did not open. Check that another program is not using it.";
}

function downsample(samples, from, to) {
  if (from === to) {
    return samples;
  }
  const ratio = from / to;
  const length = Math.max(Math.floor(samples.length / ratio), 1);
  const out = new Float32Array(length);
  for (let index = 0; index < length; index += 1) {
    const start = Math.floor(index * ratio);
    const end = Math.min(Math.floor((index + 1) * ratio), samples.length);
    let sum = 0;
    let count = 0;
    for (let cursor = start; cursor < end; cursor += 1) {
      sum += samples[cursor];
      count += 1;
    }
    out[index] = count ? sum / count : 0;
  }
  return out;
}

function encodeWav(samples, rate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const text = (offset, value) => {
    for (let index = 0; index < value.length; index += 1) {
      view.setUint8(offset + index, value.charCodeAt(index));
    }
  };
  text(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  text(8, "WAVE");
  text(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, rate, true);
  view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  text(36, "data");
  view.setUint32(40, samples.length * 2, true);
  for (let index = 0; index < samples.length; index += 1) {
    const value = Math.max(-1, Math.min(1, samples[index]));
    view.setInt16(44 + index * 2, value * 32767, true);
  }
  return new Blob([buffer], { type: "audio/wav" });
}

async function begin() {
  if (busy || document.hidden) {
    return;
  }
  if (stream) {
    return;
  }
  const app = await beginTarget();
  target = Boolean(app);
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (failure) {
    setState("Microphone blocked", describeMicrophone(failure), true);
    return;
  }
  context = new (window.AudioContext || window.webkitAudioContext)();
  source = context.createMediaStreamSource(stream);
  processor = context.createScriptProcessor(2048, 1, 1);
  sink = context.createGain();
  sink.gain.value = 0;
  chunks = [];
  sentChunks = 0;
  clearInterval(partials);
  partials = setInterval(sendPartial, 800);
  processor.onaudioprocess = (event) => {
    const block = event.inputBuffer.getChannelData(0);
    const copy = new Float32Array(block.length);
    copy.set(block);
    chunks.push(copy);
    if (chunks.length * copy.length > context.sampleRate * MAX_SECONDS) {
      stop();
    }
  };
  source.connect(processor);
  processor.connect(sink);
  sink.connect(context.destination);
  started = performance.now();
  document.body.classList.add("listening");
  document.body.classList.remove("showing-hint");
  setState(
    "Listening",
    app
      ? "Into " + app + ". Release to write it down, Escape to cancel."
      : "No text field in front, so the words go to the clipboard.",
    true,
  );
  report("listening");
  clearInterval(ticker);
  ticker = setInterval(() => {
    clockEl.textContent = ((performance.now() - started) / 1000).toFixed(1) + " s";
  }, 100);
}

function endStream() {
  clearInterval(partials);
  partials = null;
  fetch("/listen/stream-end", {
    method: "POST",
    headers: { Authorization: "Bearer " + token },
    keepalive: true,
  }).catch(() => {});
}

async function sendPartial() {
  if (!stream || !context || busy) {
    return;
  }
  const batch = chunks.slice(sentChunks);
  if (!batch.length) {
    return;
  }
  sentChunks = chunks.length;
  const total = batch.reduce((sum, chunk) => sum + chunk.length, 0);
  const merged = new Float32Array(total);
  let offset = 0;
  for (const chunk of batch) {
    merged.set(chunk, offset);
    offset += chunk.length;
  }
  try {
    const response = await fetch("/listen/stream", {
      method: "POST",
      headers: { "Content-Type": "audio/wav", Authorization: "Bearer " + token },
      body: encodeWav(downsample(merged, context.sampleRate, TARGET_RATE), TARGET_RATE),
    });
    if (!response.ok || busy) {
      return;
    }
    const pieces = await response.json();
    const last = pieces.filter((piece) => piece.text).pop();
    if (last && !busy) {
      lineEl.textContent = last.text;
      lineEl.classList.toggle("pending", last.state !== "final");
    }
  } catch (failure) {
    return;
  }
}

function release() {
  endStream();
  clearInterval(ticker);
  ticker = null;
  document.body.classList.remove("listening");
  if (processor) {
    processor.onaudioprocess = null;
    processor.disconnect();
  }
  if (source) {
    source.disconnect();
  }
  if (sink) {
    sink.disconnect();
  }
  if (stream) {
    stream.getTracks().forEach((track) => track.stop());
  }
  if (context && context.state !== "closed") {
    context.close();
  }
  const rate = context ? context.sampleRate : 48000;
  stream = null;
  context = null;
  source = null;
  processor = null;
  sink = null;
  const collected = chunks;
  chunks = [];
  const length = collected.reduce((total, chunk) => total + chunk.length, 0);
  if (!length) {
    return null;
  }
  const merged = new Float32Array(length);
  let offset = 0;
  for (const chunk of collected) {
    merged.set(chunk, offset);
    offset += chunk.length;
  }
  const seconds = length / rate;
  if (seconds < 0.2) {
    return null;
  }
  return { wav: encodeWav(downsample(merged, rate, TARGET_RATE), TARGET_RATE), seconds };
}

async function beginTarget() {
  try {
    const response = await fetch("/target", {
      headers: { Authorization: "Bearer " + token },
    });
    if (!response.ok) {
      return "";
    }
    const values = await response.json();
    return values.insertable ? values.app || "" : "";
  } catch (failure) {
    return "";
  }
}

async function loadWriteTarget() {
  try {
    const response = await fetch("/settings", { cache: "no-store" });
    if (!response.ok) {
      return;
    }
    const values = await response.json();
    writeTarget = (values.write || "").toLowerCase();
    sourceLanguage = (values.from || "").toLowerCase();
    shortcut = values.shortcut || shortcut;
  } catch (failure) {
    writeTarget = "";
  }
}

async function loadVersion() {
  try {
    const response = await fetch("/update", { cache: "no-store" });
    if (!response.ok) {
      return;
    }
    const update = await response.json();
    if (!update.available || !update.latest) {
      return;
    }
    setHint("v" + update.latest + " is available, you are on v" + version + ". Open the window to update.");
  } catch (failure) {
    return;
  }
}

async function writeIntoField(text, signal) {
  if (!target) {
    return false;
  }
  try {
    const response = await fetch("/insert", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ text: text }),
      signal,
    });
    return response.ok;
  } catch (failure) {
    return false;
  }
}

function cancel() {
  const hadSomething = Boolean(stream) || busy;
  if (controller) {
    controller.abort();
    controller = null;
  }
  if (stream) {
    release();
  }
  busy = false;
  clearInterval(ticker);
  ticker = null;
  clockEl.textContent = "0.0 s";
  document.body.classList.remove("listening", "showing-hint");
  if (hadSomething) {
    setState("Ready", "Cancelled. Nothing was inserted.", true);
  } else {
    setState("Ready", lastText || "Press the shortcut and speak.", !lastText);
  }
  report("cancelled");
}

async function stop() {
  if (!stream || busy) {
    return;
  }
  busy = true;
  let failed = false;
  const captured = release();
  clockEl.textContent = "0.0 s";
  if (!captured) {
    setState("Ready", lastText || "Press the shortcut and speak.", !lastText);
    busy = false;
    report("idle");
    return;
  }
  setState("Writing", "Your words are being written down.", true);
  report("processing");
  controller = new AbortController();
  const { signal } = controller;
  try {
    const headers = { "Content-Type": "audio/wav", Authorization: "Bearer " + token };
    const target = translate ? writeTarget : sourceLanguage;
    if (target) {
      headers["x-parlo-write"] = target;
    }
    const response = await fetch("/dictate", {
      method: "POST",
      headers,
      body: captured.wav,
      signal,
    });
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}));
      throw new Error(detail.error || "Parlo answered with status " + response.status + ".");
    }
    const result = await response.json();
    const spoken = (result.text || "").trim();
    const text = (result.translation || "").trim() || spoken;
    if (!text) {
      setState("Nothing heard", "Speak a little closer to the microphone.", true);
      busy = false;
      report("error");
      return;
    }
    lastText = text;
    const inserted = await writeIntoField(text, signal);
    const translated = Boolean(spoken) && spoken !== text;
    setState(inserted ? "Inserted" : "Copied", text, false);
    setHint(
      (inserted
        ? "Written into the field you were in."
        : "Copied to the clipboard. Paste it where you need it.") +
        (translated ? " Heard: " + spoken : ""),
    );
    if (!inserted) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (failure) {
        setHint("The clipboard refused the text. Select it here and copy by hand.");
      }
    }
  } catch (failure) {
    if (signal.aborted) {
      setState("Ready", "Cancelled. Nothing was inserted.", true);
      failed = true;
    } else {
      setState("Failed", failure.message || "The dictation failed.", true);
      failed = true;
    }
  }
  controller = null;
  busy = false;
  report(failed ? (signal.aborted ? "cancelled" : "error") : "success");
}

function handsFree() {
  setState("Listening", "Hands free. Press the shortcut again to stop, Escape to cancel.", true);
}

function paintTranslate() {
  translateEl.setAttribute("aria-pressed", String(translate));
  translateEl.textContent = translate ? "Translate on" : "Translate off";
}

function arm() {
  document.body.classList.remove("ready", "listening", "showing-hint");
  setState("Ready", "Hold the shortcut to talk.", true);
  clockEl.textContent = "0.0 s";
  report("armed");
}

function ready() {
  if (stream || busy) {
    return;
  }
  document.body.classList.add("ready");
  document.body.classList.remove("listening", "showing-hint");
  setState("Ready", lastText || "Choose, then record.", !lastText);
  report("armed");
}

const translateEl = document.getElementById("translate");
const recordEl = document.getElementById("record");

translateEl.addEventListener("click", () => {
  translate = !translate;
  localStorage.setItem("parlo-translate", translate ? "on" : "off");
  paintTranslate();
});

recordEl.addEventListener("click", () => {
  document.body.classList.remove("ready");
  begin();
});

paintTranslate();

window.parloArm = arm;
window.parloReady = ready;
window.parloBegin = begin;
window.parloStop = stop;
window.parloCancel = cancel;
window.parloHandsFree = handsFree;

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    ready();
  }
});

window.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    event.preventDefault();
    cancel();
  }
});

loadVersion();
loadWriteTarget();
if (!document.hidden) {
  ready();
}
</script>
</body>
</html>
